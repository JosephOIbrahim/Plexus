# Third Plexus mission: the Cozy organ against what a real engine sends. It scores Joe's frozen test_organ_malformed.py, thirteen replies
# an engine can send that the organ cannot read today, against the fake engine, and keeps the rest of phase 2 green. The real ComfyUI is
# read by tests/acceptance/live/test_organ_live.py on every keep, by hand, outside the score. Plan: missions/organ-live.plan.md.

[mission]
name = "organ-live"
goal = "Make Joe's frozen tests/acceptance/phase2/test_organ_malformed.py pass by changing plexus/organs/cozy.py only, so every reply an engine can send ends in an OrganError and no HTTP call waits past a job's deadline, without breaking any other phase 2 test, phase 1, or the run against a real ComfyUI. tests/acceptance/CONTRACT.md is the Python surface; harness/plexus_loop/missions/organ-live.worker.md says what the step is."
requires = ["tests/acceptance/phase2/test_organ_malformed.py", "tests/acceptance/live/test_organ_live.py", "tests/acceptance/phase2/test_t7_round_trip.py", "tests/acceptance/phase1"]
# One file. neuron.py, protocol.py and the rest of plexus/ are out, so a reply that touches them drops before anything runs.
focus = ["plexus/organs/cozy.py"]
frozen = ["tests/acceptance/**", "harness/**", "docs/plexus/**", "PLEXUS_SPEC.md", ".github/**", "pyproject.toml"]
# cozy.py is under Files as the step's own file. The malformed test is small and is the target, so it is in view; test_organ_surface.py is not,
# and a failure's own text reaches the next prompt.
context = [
  "harness/plexus_loop/missions/organ-live.worker.md",
  "tests/acceptance/CONTRACT.md",
  "tests/acceptance/phase2/test_organ_malformed.py",
]

[metric]
kind = "pytest_failures"
target = "tests/acceptance/phase2"
direction = "lower"
min_delta = 1
# All of phase 2 with the reference cozy.py took 18 s on Nov 9. A reply that waits a whole socket timeout on every hung call is what this limit catches.
timeout_s = 300

[[gates]]
name = "layers"
cmd = ["python", "-m", "pytest", "-q", "harness/plexus_loop/guards"]
timeout_s = 600

[[gates]]
name = "core"
cmd = ["python", "harness/plexus_loop/build_core.py"]
timeout_s = 1800

[[gates]]
name = "predicate_smoke"
cmd = ["python", "-I", "harness/plexus_loop/predicate_smoke.py"]
timeout_s = 120

[[gates]]
name = "cargo"
cmd = ["cargo", "test", "--workspace", "--quiet"]
timeout_s = 1800

# The same narrowed set as missions acceptance and organ, Joe's word of Nov 1. Dropping it is Joe's call.
[[gates]]
name = "unit"
cmd = ["python", "-m", "pytest", "-q", "-x", "-m", "not integration",
       "tests/harness_plexus_loop", "tests/test_portability_guards.py",
       "tests/test_workflow_patch_engine_live.py"]
timeout_s = 1800

[worker]
kind = "ollama"
model = "qwen3-coder:30b"
host = "http://127.0.0.1:11434"
# cozy.py whole is about 2,900 tokens to write; the worst write rate on record, 1.54 tokens a second, gives 1,900 s. 4800 as before.
timeout_s = 4800
context_chars = 95000
num_ctx = 49152

[router]
kind = "first"

[[steps]]
id = "L1"
targets = ["tests/acceptance/phase2/test_organ_malformed.py"]
files = ["plexus/organs/cozy.py"]
text = '''Your reply is exactly one ```file:plexus/organs/cozy.py block holding the whole file, from its first line to its last, and never a ```diff block. Start from the copy of plexus/organs/cozy.py under Files and change only what this step names; every other line stays exactly as it is, because T7, T8, test_organ_surface.py and the run against a real ComfyUI already pass on it. Frozen test_organ_malformed.py gives the organ thirteen replies it cannot read today, and each must end in an OrganError: the caller catches one type. These are the seven changes, in the order they sit in the file. One: right after the line HTTP_TIMEOUT_S = 60.0 add the line MIN_CALL_S = 0.5 and then two module-level functions, def _json(data: bytes, route: str): whose body is try: return json.loads(data.decode('utf-8')) and except ValueError as e: raise OrganError(f"{route}: the engine's reply is not JSON") from e, and def _call_timeout(deadline: float | None) -> float: whose body is if deadline is None: return HTTP_TIMEOUT_S and then return max(MIN_CALL_S, min(HTTP_TIMEOUT_S, deadline - time.monotonic())). A ValueError covers both a body that is not UTF-8 and one that is not JSON. Two, in submit, right before the seed's range check: if type(job.seed) is not int: raise OrganError(f"Seed {job.seed!r} is not an int"), because a bool is an int to isinstance and plexus:seed is an Int64. Three, in submit, right after graph = copy.deepcopy(job.graph) and before seed_written = False: for node_id, node in graph.items(): and inside it if not isinstance(node, dict) or not isinstance(node.get('inputs'), dict) or 'class_type' not in node: raise OrganError(f"Node {node_id} has no inputs or no class_type"), so a graph the organ cannot read is refused before anything is posted. Four, in submit's POST: the line result = json.loads(response.read().decode()) becomes result = _json(response.read(), '/prompt'), and the whole except urllib.error.HTTPError as e: branch, all its lines, becomes the one line raise OrganError(f"/prompt refused the graph ({e.code}): {e.read().decode('utf-8', 'replace')}") from e, for every code, because the engine explains a refusal in the body whether or not it is JSON. The except (urllib.error.URLError, OSError) branch after it stays. Then the line prompt_id = result['prompt_id'] becomes prompt_id = result.get('prompt_id') if isinstance(result, dict) else None followed by if not prompt_id: raise OrganError("/prompt: the engine's reply holds no prompt_id"). Five, in stream and in result: each line entry = self._history_entry(job.prompt_id) becomes entry = self._history_entry(job.prompt_id, deadline), so the history read knows the deadline. Six, in result, the line for node_outputs in entry['outputs'].values(): becomes three lines: outputs = entry.get('outputs'), then if not isinstance(outputs, dict): raise OrganError("the engine's history entry holds no outputs"), then for node_outputs in outputs.values():. Seven: in _get_json, return json.loads(response.read().decode()) becomes return _json(response.read(), route); in _history_entry, the signature becomes def _history_entry(self, prompt_id: str, deadline: float | None = None) -> dict | None:, its urlopen takes timeout=_call_timeout(deadline) in place of timeout=HTTP_TIMEOUT_S, the line result = json.loads(response.read().decode()) becomes result = _json(response.read(), '/history'), and return result.get(prompt_id) moves out of the with block, one indent left, as return result.get(prompt_id) if isinstance(result, dict) else None. Its except branches stay as they are: a 5xx, a URLError or an OSError still means not yet, and a socket that times out is an OSError, so the loop meets its deadline and raises. Nothing else in the file changes, and no error text names prompt_id or the URL of the history read.'''

[budget]
attempts = 8
hours = 6
max_consecutive_failures = 8

[houdini]
cpu_threads = 8
cargo_jobs = 4

# The failure router is off for this mission, so nothing leaves the machine.
[fix_router]
kind = "none"

