# Fourth Plexus mission, M2: organs on the stage. It scores Joe's two frozen files: test_organ_registry.py, which reads the organ prim that
# NeuronRuntime.publish_organ(profile) defines under /Plexus/Organs (step R1, neuron.py), and test_organ_reply_shapes.py, 53 replies the Cozy
# organ still lets escape as something other than OrganError (step R2, cozy.py). The rest of phase 2 stays green. The real ComfyUI is read by
# tests/acceptance/live/test_organ_live.py on every keep, by hand, outside the score. Plan: missions/organ-registry.plan.md.

[mission]
name = "organ-registry"
goal = "Make Joe's frozen tests/acceptance/phase2/test_organ_registry.py and test_organ_reply_shapes.py pass, one step and one file at a time: step R1 adds NeuronRuntime.publish_organ to plexus/core/neuron.py, so every participant's runtime sees which engines exist, and step R2 makes plexus/organs/cozy.py end every reply it still cannot read in an OrganError. Break no other phase 2 test, no phase 1 test and not the run against a real ComfyUI. tests/acceptance/CONTRACT.md is the Python surface; harness/plexus_loop/missions/organ-registry.worker.md says what each step is."
# The gate test is C3's: requiring it means a run cannot start before C3 lands, when the 0428f77 gate would ignore --may-add and drop every R1 reply.
requires = ["tests/acceptance/phase2/test_organ_registry.py", "tests/acceptance/phase2/test_organ_reply_shapes.py", "tests/acceptance/phase2/test_t7_round_trip.py", "tests/acceptance/phase1", "tests/harness_plexus_loop/test_neuron_unchanged.py"]
# Two files, one per step. The rest of plexus/, crates/** and Cargo.toml are out, so a reply that touches them drops before anything runs.
focus = ["plexus/core/neuron.py", "plexus/organs/cozy.py"]
frozen = ["tests/acceptance/**", "harness/**", "docs/plexus/**", "PLEXUS_SPEC.md", ".github/**", "pyproject.toml"]
# Both focus files reach every prompt after these, sorted, so neuron.py comes before cozy.py. test_organ_registry.py, 33,767 characters, is out:
# R1's text gives every line of the method, and a failure's own text reaches the next prompt, as test_organ_surface.py was left out of mission
# organ. With it in, R2's prompt after R1 keeps leaves cozy.py out. The reply-shapes test is in, with test_organ_malformed.py, which it imports.
# The plan's section 3 has both measures.
context = [
  "harness/plexus_loop/missions/organ-registry.worker.md",
  "tests/acceptance/CONTRACT.md",
  "tests/acceptance/phase2/test_organ_malformed.py",
  "tests/acceptance/phase2/test_organ_reply_shapes.py",
]

[metric]
kind = "pytest_failures"
target = "tests/acceptance/phase2"
direction = "lower"
min_delta = 1
# Phase 2 with both references took about 20 s on Nov 9 (175 items). The limit is mission organ-live's: it catches a reply that waits a whole
# socket timeout on every hung call. The registry test's own waits are bounded: 10 s a publish, 10 s to go idle, 60 s a child process; but a
# publish_organ that hangs costs about 10 s in each of some 39 tests, about 390 s (critic, Nov 9), so the limit is 600 s, which a right reply never nears.
timeout_s = 600

# Gates run in this order before the metric. Cheapest and most structural first.
[[gates]]
name = "layers"
cmd = ["python", "-m", "pytest", "-q", "harness/plexus_loop/guards"]
timeout_s = 600

# R1 sends neuron.py whole, and most of its lines are read by no frozen test. This reads the parsed code against the last kept commit: every
# statement stands, and the file gains NeuronRuntime.publish_organ alone. --may-add replaces the default _Ctx.author_asset, so a change to
# author_asset now drops too. The option is scaffolding commit C3, in Claude's own commit before the first run. The gate at 0428f77 reads no
# options, so without C3 it ignores this one and drops every R1 reply with "new: NeuronRuntime.publish_organ".
[[gates]]
name = "neuron_unchanged"
cmd = ["python", "-I", "harness/plexus_loop/neuron_unchanged.py", "--may-add", "NeuronRuntime.publish_organ"]
timeout_s = 120

[[gates]]
name = "core"
cmd = ["python", "harness/plexus_loop/build_core.py"]
timeout_s = 1800

[[gates]]
name = "predicate_smoke"
cmd = ["python", "-I", "harness/plexus_loop/predicate_smoke.py"]
timeout_s = 120

[[gates]]
name = "cargo"
cmd = ["cargo", "test", "--workspace", "--quiet"]
timeout_s = 1800

# The same narrowed set as missions acceptance, organ and organ-live, Joe's word of Nov 1. After C3 it also runs the gate's own test,
# tests/harness_plexus_loop/test_neuron_unchanged.py. Dropping it is Joe's call.
[[gates]]
name = "unit"
cmd = ["python", "-m", "pytest", "-q", "-x", "-m", "not integration",
       "tests/harness_plexus_loop", "tests/test_portability_guards.py",
       "tests/test_workflow_patch_engine_live.py"]
timeout_s = 1800

[worker]
kind = "ollama"
model = "qwen3-coder:30b"
host = "http://127.0.0.1:11434"
# neuron.py whole with the method is 17,648 characters, about 4,400 tokens to write; at the worst write rate on record, 1.54 tokens a second,
# that is about 2,860 s, and the prompt read at the worst read rate, 23.2 tokens a second, adds about 1,000 s. 4800 as before.
timeout_s = 4800
context_chars = 95000
num_ctx = 49152

# R1 and R2 change different files and neither builds on the other, so R2 names no `after`. "first" takes the earliest ready step, so R1 has
# every attempt until all its targets pass, and R2 starts after that. No key is needed.
[router]
kind = "first"

[[steps]]
id = "R1"
targets = ["tests/acceptance/phase2/test_organ_registry.py"]
files = ["plexus/core/neuron.py"]
text = '''Your reply is exactly one ```file:plexus/core/neuron.py block holding the whole file, from its first line to its last, and never a ```diff block. Start from the copy of plexus/core/neuron.py under Files and change only what this step names: it adds one method, NeuronRuntime.publish_organ, and nothing else. Every other line stays exactly as it is, register, start, _on_event, _run_action, _Ctx.author and _Ctx.author_asset above all, because the neuron_unchanged gate compares your file's code with the last kept commit and drops any other change, a new import, a module-level constant or a new helper included. The method needs nothing new: Sdf and Usd are already imported from pxr, and _set_attr already exists. No Rust change, and write no new tests. Frozen test_organ_registry.py hands the runtime an organ's profile and reads the organ prim on the stage and in the edit layer's file, and today 39 of its 40 tests fail with AttributeError: 'NeuronRuntime' object has no attribute 'publish_organ'. Where it goes: inside class NeuronRuntime, after the last line of register, return handle, and one blank line, and before the line def start(self) -> None:, with one blank line after it. These are its lines, exactly as written here, the def at four spaces like register's and the body at eight:

    def publish_organ(self, profile) -> Sdf.Path:
        """Author an organ's profile as one prim on this participant's edit layer and return its path.

        The host calls it, usually once at startup with the organ's profile, the way it calls register().
        Every field is read and checked first, so a profile that cannot land raises with nothing authored.
        """
        root = "/Plexus/Organs"
        organ_id = profile.organ_id
        kind = profile.kind
        endpoint = profile.endpoint
        capabilities = profile.capabilities
        cost_hint = profile.cost_hint
        for field, value in (("organ_id", organ_id), ("kind", kind), ("endpoint", endpoint), ("cost_hint", cost_hint)):
            if not isinstance(value, str):
                raise TypeError(f"profile.{field} must be a str, got {type(value).__name__}: {value!r}")
        if not isinstance(capabilities, (list, tuple)):
            raise TypeError(f"profile.capabilities must be a list or tuple of str, got {type(capabilities).__name__}: {capabilities!r}")
        for item in capabilities:
            if not isinstance(item, str):
                raise TypeError(f"profile.capabilities must hold only str, got {type(item).__name__}: {item!r}")
        definition = Usd.SchemaRegistry().FindAppliedAPIPrimDefinition("PlexusOrganAPI")
        if definition is None:
            raise RuntimeError("USD's schema registry lacks PlexusOrganAPI. Import plexus before anything builds the registry, or set PXR_PLUGINPATH_NAME to plexus.schema.plugin_dir().")
        for name, value in (("plexus:kind", kind), ("plexus:costHint", cost_hint)):
            allowed = definition.GetAttributeDefinition(name).GetMetadata("allowedTokens")
            if value not in allowed:
                raise ValueError(f"{name} {value!r} is not one of PlexusOrganAPI's allowed tokens: {', '.join(allowed)}")
        if not Sdf.Path.IsValidIdentifier(organ_id):
            raise ValueError(f"profile.organ_id {organ_id!r} is not a valid prim name: it must be a USD identifier, a letter or underscore followed by letters, digits or underscores.")
        path = Sdf.Path(root).AppendChild(organ_id)
        values = [
            ("plexus:organId", organ_id, Sdf.ValueTypeNames.String),
            ("plexus:kind", kind, Sdf.ValueTypeNames.Token),
            ("plexus:endpoint", endpoint, Sdf.ValueTypeNames.String),
            ("plexus:capabilities", sorted(capabilities), Sdf.ValueTypeNames.StringArray),
            ("plexus:costHint", cost_hint, Sdf.ValueTypeNames.Token),
        ]
        scratch = Sdf.Layer.CreateAnonymous()
        probe = Sdf.CreatePrimInLayer(scratch, path)
        for name, value, type_name in values:
            _set_attr(probe, name, value, type_name)
        layer = self.edit_layer
        with self._lock:
            with Sdf.ChangeBlock():
                spec = Sdf.CreatePrimInLayer(layer, path)
                for prefix in path.GetPrefixes():
                    layer.GetPrimAtPath(prefix).specifier = Sdf.SpecifierDef
                spec.SetInfo("apiSchemas", Sdf.TokenListOp.Create(prependedItems=["PlexusOrganAPI"]))
                for name, value, type_name in values:
                    _set_attr(spec, name, value, type_name)
            layer.Save()
        return path

Why each part is there, so none is dropped: the five fields are read first by attribute name, so a profile without one raises AttributeError; each type is checked with isinstance and never coerced, because Sdf lands None on a string silently; the allowed tokens are read from Usd.SchemaRegistry and never written in neuron.py; every value is set on a probe in a scratch layer before the lock, so a value Sdf cannot hold raises there with nothing authored in the edit layer; there is no publication gate, because /Plexus/Organs is the runtime's own record as /Plexus/Neurons is; and layer.Save() runs inside with self._lock, after the ChangeBlock. neuron.py still never imports plexus.organs, even for a type hint, and never names an organ kind or an engine, in code, comments or strings. The reply must differ from that copy of neuron.py in those lines and in no others.'''

# R2: the reviewer's findings on organ-live's keep 8978468, eight escapes and a ninth found while proving them. Text from the L2 lane, STEP_R2.md, verbatim.
[[steps]]
id = "R2"
targets = ["tests/acceptance/phase2/test_organ_reply_shapes.py"]
files = ["plexus/organs/cozy.py"]
text = '''Your reply is exactly one ```file:plexus/organs/cozy.py block holding the whole file, from its first line to its last, and never a ```diff block. Start from the copy of plexus/organs/cozy.py under Files and change only what this step names; every other line stays exactly as it is, because T7, T8, test_organ_surface.py, test_organ_malformed.py and the run against a real ComfyUI already pass on it. Write no new tests. Frozen test_organ_reply_shapes.py gives the organ 51 cases, engine replies and graphs, that still escape it as AttributeError, TypeError, KeyError, ValueError or one of http.client's own errors, and each must end in an OrganError. http.client.HTTPException, which covers BadStatusLine, IncompleteRead and InvalidURL, is not an OSError, so no except OSError catches it. These are the eleven changes, in the order they sit in the file. One: right after the line import hashlib add the line import http.client, the only new import. Two, in submit, the POST's try is split in two. The line body = json.dumps({'prompt': graph}).encode('utf-8') gets a try of its own: try: then that line, then except (TypeError, ValueError) as e: raise OrganError(f"The graph holds a value JSON cannot write: {e}") from e. Then a second try: begins on the next line and holds the four lines that were in the first one after it, from req = urllib.request.Request(self._endpoint + '/prompt', data=body) to result = _json(response.read(), '/prompt'), so a graph json cannot write is refused before anything is posted. Three, in that second try's except urllib.error.HTTPError as e: branch, the one line raise OrganError(f"/prompt refused the graph ({e.code}): {e.read().decode('utf-8', 'replace')}") from e becomes five lines: try:, then words = e.read().decode('utf-8', 'replace'), then except (OSError, http.client.HTTPException):, then words = '', and after them raise OrganError(f"/prompt refused the graph ({e.code}): {words}") from e, at the indent of the try. Four, the next branch except (urllib.error.URLError, OSError) as e: becomes except (urllib.error.URLError, OSError, http.client.HTTPException) as e: and its body stays. Five, after it, the two lines if not prompt_id: and raise OrganError("/prompt: the engine's reply holds no prompt_id") become if not isinstance(prompt_id, str) or not prompt_id: and raise OrganError("/prompt: the engine's reply holds no prompt_id that is a string"), because the organ builds the /history URL and reads the history reply by it. Six, in result, the line for img in node_outputs.get('images', []): becomes four lines inside the loop for node_outputs in outputs.values():, first images = node_outputs.get('images', []) if isinstance(node_outputs, dict) else None, then if not isinstance(images, list) or not all(isinstance(img, dict) for img in images): with raise OrganError("the engine's history entry holds outputs that are not objects with a list of image objects") under it, then for img in images:, whose body stays as it is. Seven, in _get_json, the line return _json(response.read(), route) becomes result = _json(response.read(), route), the except line except (urllib.error.URLError, OSError) as e: becomes except (urllib.error.URLError, OSError, http.client.HTTPException) as e: and its body stays, and after the whole try, at the indent of the try, come three lines: if not isinstance(result, dict):, then raise OrganError(f"{route}: the engine's reply is not a JSON object") under it, then return result. Every route _get_json reads, /object_info and /system_stats, answers an object. Eight, in _history_entry, inside the with block, the line return result.get(prompt_id) if isinstance(result, dict) else None becomes four lines at the same indent: entry = result.get(prompt_id) if isinstance(result, dict) else None, then if entry is not None and (not isinstance(entry, dict) or not isinstance(entry.get('status') or {}, dict)):, then raise OrganError("/history: the engine's entry for this job, or its status, is not a JSON object") under it, then return entry. An entry of None still means not yet, and a missing or null status still means done: ComfyUI's task_done takes an optional status and writes null when it has none. Because a null status now gets this far, the line status = entry.get('status', {}).get('status_str') in stream and the same line in result each become status = (entry.get('status') or {}).get('status_str'), at the same indent, so a null status reads as no status and never raises AttributeError. Nine, in _history_entry, after the last except branch, except (urllib.error.URLError, OSError) as e: with its comment and return None, add one more branch at the same indent: except http.client.HTTPException as e: with raise OrganError(f"/history: the engine's reply is not HTTP the organ can read ({type(e).__name__})") from e under it. It goes last and never before the OSError branch, because a dropped connection is RemoteDisconnected, which is both an OSError and an HTTPException, and it still means not yet. The error names the exception's type and not its text, because InvalidURL's text holds the URL of the history read. Ten, in _fetch_file, the line filename = image['filename'] becomes three lines: filename = image.get('filename'), then if not isinstance(filename, str):, then raise OrganError("the engine's output image names no filename that is a string") under it; and in the same method the line except (urllib.error.URLError, OSError) as e: becomes except (urllib.error.URLError, OSError, http.client.HTTPException) as e: and its body stays. Eleven, in _env_fingerprint, the whole statement fingerprint_data = { ... } from its first line to its closing brace moves one indent right, inside a new try: that sits where it started, right after the comment # Hash only the required fields, and after it, at the indent of the try, except (KeyError, TypeError) as e: with raise OrganError(f"/system_stats: the engine's reply lacks a field the fingerprint reads: {e!r}") from e under it. Nothing else in the file changes, and no error text holds the engine's job id or the URL of the history read.'''

# A day run. At 30 to 40 minutes an attempt, 8 attempts take at most about 5.3 hours, and the run stops as soon as every target test passes.
[budget]
attempts = 8
hours = 6
max_consecutive_failures = 8

[houdini]
cpu_threads = 8
cargo_jobs = 4

# The failure router is off for this mission, so nothing leaves the machine.
[fix_router]
kind = "none"

# Recognised failures and the brief line that fixes each. The harness quotes the line under the dropped attempt's own target failure, or under
# a failing gate's output when there are no target failures. Each anchor appears once in the brief, and each match was tried on real failure
# text from the proof's logs; check_mission.py checks both.
[[known_fixes]]
match = "'NeuronRuntime' object has no attribute 'publish_organ'"
file = "harness/plexus_loop/missions/organ-registry.worker.md"
anchor = "`publish_organ` is a method of `NeuronRuntime`"

[[known_fixes]]
match = 'adds NeuronRuntime\.publish_organ and changes nothing else'
file = "harness/plexus_loop/missions/organ-registry.worker.md"
anchor = "The `neuron_unchanged` gate compares"

[[known_fixes]]
match = 'neuron\.py names an organ kind|neuron\.py imports \[|engine vocabulary leaked into the core'
file = "harness/plexus_loop/missions/organ-registry.worker.md"
anchor = "The core is blind to the engine"

[[known_fixes]]
match = 'after it had authored into the edit layer in memory|raised for .* and the edit layer.s file changed'
file = "harness/plexus_loop/missions/organ-registry.worker.md"
anchor = "Every check of `publish_organ` finishes before anything is authored"

[[known_fixes]]
match = 'let go of self\._lock while|authored and saved without taking self\._lock'
file = "harness/plexus_loop/missions/organ-registry.worker.md"
anchor = "`layer.Save()` runs inside `with self._lock:`"

[[known_fixes]]
match = 'raised (BadStatusLine|IncompleteRead|InvalidURL)'
file = "harness/plexus_loop/missions/organ-registry.worker.md"
anchor = "`http.client.HTTPException`, which covers"

[[known_fixes]]
match = "Comfy-Cozy is a reference only"
file = "harness/plexus_loop/missions/organ-registry.worker.md"
anchor = "Never import `agent`, `cognitive`"

[[known_fixes]]
match = "these modules must stay free of pxr"
file = "harness/plexus_loop/missions/organ-registry.worker.md"
anchor = "`cozy.py` never imports `pxr`"
