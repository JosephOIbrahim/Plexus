# First Plexus mission (Blueprint v5.3 §11 Phase 1, §12).
# It scores the frozen phase 1 acceptance tests (the schema gate and T1 to T6)
# and refuses to start until tests/acceptance/phase1 exists. T7 and T8 in
# phase2 are the next mission. Claude writes and revises mission files; the local
# worker only makes attempts inside one. Plan: missions/acceptance.plan.md.
# Joe's decisions (Nov 1): Option A, narrowed unit gate, this file and C1-C6 as written,
# no maturin in pyproject.toml, five Jev-routed attempts for the first run.
# Joe (Nov 3, after run 10): router "first" (earliest failing step), worker timeout 3600 s.
# Joe (Nov 3, before run 13, "A + set"): router "jev" again, over ready steps only (steps name
# `after`); context_chars 120000 and num_ctx 49152; four S3 brief fixes with known fixes
# (E0106, E0204, E0308, E0277); the harness drops a reply that leaves out any step file.
# Joe (Nov 3, 17:00, after run 13 attempts 1-2): run 14 is the bounded Option A try. S3 starts from
# the brief's full-signature predicate.rs skeleton and writes no unit tests; two more known fixes
# from run 13 attempt 1. If run 14 keeps nothing, the next run starts from prep/option-b, no ask.
# Nov 3, 18:50, after run 14 attempt 2 (d626436, a false keep: compile() rejected every predicate,
# the valid ones included, and the rejection-only target passed): the predicate_smoke gate, six
# brief lines on the parser, S5's unseeded-delta rule, and the night budget (Joe, decision 2).
# Nov 3, 20:20, after run 15 attempt 1 kept S3 honestly (9d7bb5f, reviewer: merge-ready): the brief
# gains 'What the kept S3 code still owes S4' and S5's delta pins; S5 may fix in_scope's descendant rule.
# Nov 3, 22:10, after run 16 attempts 1-2 left _on_event as pass (the S4 text named the S2 list, not the S3
# one, and the worker applied only what was named): the S4 text names it, the dispatcher, the allowlist
# (Sdf.Path prim paths, no '/**' glob) and ctx.author are spelled out, and a known fix quotes the dispatcher.

[mission]
name = "acceptance"
goal = "Make the frozen Plexus phase 1 acceptance tests in tests/acceptance/phase1 (the schema gate and T1 to T6, from PLEXUS_SPEC.md) pass, one honest step at a time. tests/acceptance/CONTRACT.md is the Python surface they call; harness/plexus_loop/missions/acceptance.worker.md says how the work is split and what the gates enforce."
requires = ["tests/acceptance/phase1", "PLEXUS_SPEC.md"]
focus = ["plexus/**", "crates/**", "Cargo.toml", "Cargo.lock"]
frozen = ["tests/acceptance/**", "harness/**", "docs/plexus/**", "PLEXUS_SPEC.md", ".github/**", "pyproject.toml"]
context = [
  "harness/plexus_loop/missions/acceptance.worker.md",
  "tests/acceptance/CONTRACT.md",
  "tests/acceptance/_support.py",
  "tests/acceptance/conftest.py",
  "tests/acceptance/phase1/test_t0_schema_gate.py",
  "tests/acceptance/phase1/test_t1_propagation.py",
  "tests/acceptance/phase1/test_t2_predicate_precision.py",
  "tests/acceptance/phase1/test_t3_budget.py",
  "tests/acceptance/phase1/test_t4_provenance.py",
  "tests/acceptance/phase1/test_t5_gate.py",
  "tests/acceptance/phase1/test_t6_truth.py",
  "PLEXUS_SPEC.md",
]

[metric]
kind = "pytest_failures"
target = "tests/acceptance/phase1"
direction = "lower"
min_delta = 1

# Gates run in this order before the metric. Cheapest and most structural first.
[[gates]]
name = "layers"
cmd = ["python", "-m", "pytest", "-q", "harness/plexus_loop/guards"]
timeout_s = 600

[[gates]]
name = "core"
cmd = ["python", "harness/plexus_loop/build_core.py"]
timeout_s = 1800

# Positive check (Nov 3, after the false keep d626436): the predicates the frozen tests register
# must compile once plexus/core/predicate.py exists, and the two bad ones must raise. Before S3
# lands it has nothing to check. The compile and raise checks are the frozen tests' own; the
# paths() check is the brief's Option A contract that S5's seed reads. -I keeps the harness
# directory from shadowing stdlib modules, as the gate's own test runs it.
[[gates]]
name = "predicate_smoke"
cmd = ["python", "-I", "harness/plexus_loop/predicate_smoke.py"]
timeout_s = 120

[[gates]]
name = "cargo"
cmd = ["cargo", "test", "--workspace", "--quiet"]
timeout_s = 1800

# Narrowed on Joe's word (Nov 1): the worker can only change plexus/, crates/ and the
# Cargo files, which only repo-scanning tests and the harness's own tests can notice.
# The full comfy-cozy suite (5,158 tests, 9 min 29 s) runs once at mission end.
[[gates]]
name = "unit"
cmd = ["python", "-m", "pytest", "-q", "-x", "-m", "not integration",
       "tests/harness_plexus_loop", "tests/test_portability_guards.py",
       "tests/test_workflow_patch_engine_live.py"]
timeout_s = 1800

[worker]
kind = "ollama"
model = "qwen3-coder:30b"
host = "http://127.0.0.1:11434"
timeout_s = 3600
# Run 12 attempt 4's prompt at 100000 chars cut plexus/membrane/exchange.py and the schema
# files (checked against the rebuilt prompt). 120000 holds every run 12 prompt whole; at the
# measured ~3.7 chars per token that is ~32k tokens, and 49152 leaves room for a 6k-token reply.
context_chars = 120000
num_ctx = 49152

[router]
# Joe (Nov 3): Jev for routing. Steps name their prerequisites (`after`), so Jev only ever
# chooses among steps that are ready; with one ready step it is not called at all. 0.5 is the
# docs' floor below which a pick falls back to the earliest ready step.
kind = "jev"
model = "jev-latest"
min_confidence = 0.5

[[steps]]
id = "S1"
targets = ["tests/acceptance/phase1/test_t0_schema_gate.py"]
files = ["plexus/schema/__init__.py", "plexus/schema/plugInfo.json", "plexus/schema/generatedSchema.usda"]
text = "Schema plugin: plexus/schema/__init__.py with plugin_dir() returning the directory of that file, plus plexus/schema/plugInfo.json and plexus/schema/generatedSchema.usda defining the four codeless single-apply API schemas T0 lists (PlexusProjectAPI, PlexusAssetAPI, PlexusNeuronAPI, PlexusOrganAPI) with exactly the attributes, Sdf types and allowedTokens the test lists. Follow the file shape in the worker brief. No pxr import in plexus/schema."

[[steps]]
id = "S2"
after = ["S1"]
targets = ["tests/acceptance/phase1/test_t1_propagation.py"]
files = ["plexus/core/__init__.py", "plexus/membrane/__init__.py", "plexus/membrane/exchange.py", "plexus/core/stagekit.py", "plexus/core/axon.py"]
text = "Membrane, stagekit and axon in Python. Create plexus/core/__init__.py and plexus/membrane/__init__.py with a docstring only; never edit plexus/__init__.py; axon.py and stagekit.py never import each other. Files: plexus/membrane/exchange.py (create_exchange, register_participant, participants; registers the schema plugin in-process at import), plexus/core/stagekit.py (create_project: a root layer whose def /Exchange carries Sdf.Reference(<exchange.usda path>, '/Exchange') with an explicit prim path, because without one or a defaultPrim on exchange.usda B gets an unresolved-reference error and composes nothing; and whose /Project has PlexusProjectAPI with plexus:projectId; create_exchange and create_project use Sdf.Layer.FindOrOpen and call CreateNew only when the file is missing), and plexus/core/axon.py (StageEvent dataclass; PlexusAxon(stage, debounce_s=0.05) with subscribe, start, cool; a Tf.Notice callback that only copies paths and enqueues; one dispatcher thread that coalesces within the debounce window and calls subscribers outside the callback)."

[[steps]]
id = "S3"
after = ["S2"]
targets = ["tests/acceptance/phase1/test_t2_predicate_precision.py::test_bad_predicates_fail_at_registration"]
files = ["crates/plexus-core/src/predicate.rs", "crates/plexus-core/src/lib.rs", "crates/plexus-core/src/py.rs", "plexus/core/predicate.py", "plexus/core/neuron.py"]
text = "Rust grammar-v0 predicate, all whole files. crates/plexus-core/src/predicate.rs in plain Rust with the Value enum, compile() and Predicate signatures the brief lists: clauses changed, delta, attr, exists joined by AND only; OR or any other text is an Err; every path is absolute and inside the scope, meaning the part before the first '.' equals the scope or starts with scope + '/' (a plain starts_with would accept /Exchange/LookStateX). paths() gives each path once, in order. eval handles all four clause kinds, with delta compared against a cache that only seed and commit_wake write. Start predicate.rs from the brief's skeleton with every type and signature unchanged and every todo!() replaced; no unit tests in S3 (S5 adds them). lib.rs adds mod predicate;. py.rs is the brief's py.rs block, copied exactly; it has no Budget parts. plexus/core/predicate.py: from plexus._core import PredicateError, compile_predicate. plexus/core/neuron.py: NeuronRuntime.__init__ (register_participant first, then open the composed exchange as its stage, so the sublayer append never reaches its axon; edit_layer is Sdf.Layer.FindOrOpen of its own from_<id>.usda, the same object the stage composes) and register(), which calls compile_predicate(predicate, scope) before anything else, so PredicateError propagates."

[[steps]]
id = "S4"
after = ["S3"]
targets = ["tests/acceptance/phase1/test_t5_gate.py::test_write_inside_allowlist_lands"]
files = ["plexus/core/neuron.py", "plexus/membrane/gate.py", "plexus/core/axon.py", "plexus/membrane/exchange.py", "plexus/core/stagekit.py"]
text = "Runtime start/stop/wait_idle. First resend plexus/core/axon.py, plexus/membrane/exchange.py and plexus/core/stagekit.py whole with the fixes the brief lists under 'What the kept S2 code still owes S4' (queue.Queue with a real 50 ms window, a pending counter and idle(), no lock in the callback, the def <id> child in the participant layer); Resend plexus/core/neuron.py whole too, with the fixes the brief lists under 'What the kept S3 code still owes S4': _on_event's pass replaced by the dispatcher, register() storing the per-neuron record, a NeuronHandle that is not frozen, /Plexus and /Plexus/Neurons as def, the allowlist held as Sdf.Path prim paths and never as a '/**' glob. wait_idle polls axon.idle() and the running actions. Then: on each coalesced StageEvent, filter by the neuron's scope, evaluate it with Predicate.eval(changed, values) from S3 (changed: list of str paths from the event; values: dict of the composed values of Predicate.paths(); no Rust change in this step), run the action on a worker thread with a ctx whose author() checks the path allowlist (plexus/membrane/gate.py: the prim path /Exchange/<participant> and everything under it, plus granted paths, each an Sdf.Path checked with HasPrefix; '/**' is wording, not a path), defines missing ancestors as def, authors the value and plexus:sourceLayer into the edit layer, and saves the layer. Define /Plexus/Neurons/<name> with PlexusNeuronAPI in the edit layer at register()."

[[steps]]
id = "S5"
after = ["S4"]
targets = ["tests/acceptance/phase1/test_t2_predicate_precision.py::test_delta_threshold_and_cache", "tests/acceptance/phase1/test_t4_provenance.py"]
files = ["plexus/core/neuron.py"]
text = "Delta wiring in plexus/core/neuron.py. predicate.rs already evaluates delta since S3: touch it only to fix a bug T2 shows, or to give in_scope the descendant branch the brief states (a path under scope + '/' is inside; 9d7bb5f rejects it), and add no .rs file. register() calls Predicate.seed with the composed values of Predicate.paths(); right before the action runs, call commit_wake with the same values eval saw, so sub-threshold changes accumulate; plexus:sourceLayer on the authored prim names the edit layer; the neuron returns to state dormant after each wake and wakes counts on the handle."

[[steps]]
id = "S6"
after = ["S5"]
targets = ["tests/acceptance/phase1/test_t5_gate.py::test_write_outside_allowlist_is_dropped_and_flagged"]
files = ["plexus/core/neuron.py", "plexus/membrane/gate.py"]
text = "A write outside the allowlist is dropped (nothing lands in any exchange layer) and the neuron prim gets an attribute whose name starts with plexus:flag holding a non-empty value, saved in the edit layer."

[[steps]]
id = "S7"
after = ["S5"]
targets = ["tests/acceptance/phase1/test_t3_budget.py"]
files = ["crates/plexus-core/src/budget.rs", "crates/plexus-core/src/lib.rs", "crates/plexus-core/src/py.rs", "plexus/core/neuron.py"]
text = "Rust Budget in crates/plexus-core/src/budget.rs, plain Rust: Budget::new(wakes: u32, window_s: f64), peek(&self, now: f64) -> &'static str (pure) and admit(&mut self, now: f64) -> &'static str, each wake, trip or mute. A wake at t counts while now < t + window_s; a wake resets the trip count; the third consecutive trip mutes; once muted, always mute. Add #[cfg(test)] tests where Budget::new(1, 10.0) admitted at t = 0, 2, 4, 6 gives wake, trip, trip, mute. lib.rs adds mod budget;. py.rs, whole file, gains the brief's PyBudget block and its add_class line. The runtime follows Budget order in the brief with the injected clock; on mute it writes plexus:state = muted plus a plexus:flag attribute on the neuron prim in the edit layer, saved."

[[steps]]
id = "S8"
after = ["S5", "S6", "S7"]
targets = ["tests/acceptance/phase1/test_t6_truth.py"]
files = ["plexus/core/neuron.py"]
text = "Every opinion the runtime authors is saved as it lands, including plexus:state, plexus:lastWake and flags, so a runtime killed mid-session and reopened from disk reproduces all composed state."

# Night run (Joe, Nov 3, decision 2): sized from a 19:15 start to about 07:30. A running attempt is
# never cut, so hours = window - 1.1; attempts covers a GPU night at ~6 min each; the failure cap
# is high because no stop-on-repeat exists yet. Reset to 5 / 6 / 8 for a day run.
[budget]
attempts = 120
hours = 11
max_consecutive_failures = 30

[houdini]
cpu_threads = 8
cargo_jobs = 4

