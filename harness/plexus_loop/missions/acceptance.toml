[mission]
name = "acceptance"
goal = "Make the frozen Plexus phase 1 acceptance tests in tests/acceptance/phase1 (the schema gate and T1 to T6, from PLEXUS_SPEC.md) pass, one honest step at a time. tests/acceptance/CONTRACT.md is the Python surface they call; harness/plexus_loop/missions/acceptance.worker.md says how the work is split and what the gates enforce."
requires = ["tests/acceptance/phase1", "PLEXUS_SPEC.md"]
focus = ["plexus/**"]
frozen = ["tests/acceptance/**", "harness/**", "docs/plexus/**", "PLEXUS_SPEC.md", ".github/**", "pyproject.toml"]
context = [
  "harness/plexus_loop/missions/acceptance.worker.md",
  "tests/acceptance/CONTRACT.md",
  "tests/acceptance/_support.py",
  "tests/acceptance/conftest.py",
  "tests/acceptance/phase1/test_t1_propagation.py",
  "tests/acceptance/phase1/test_t3_budget.py",
  "tests/acceptance/phase1/test_t5_gate.py",
  "tests/acceptance/phase1/test_t6_truth.py",
  "tests/acceptance/phase1/test_budget_order.py",
  "tests/acceptance/phase1/test_mute_isolation.py",
  "tests/acceptance/phase1/test_truth_on_disk.py",
  "tests/acceptance/phase1/test_window_burst.py",
]

[metric]
kind = "pytest_failures"
target = "tests/acceptance/phase1"
direction = "lower"
min_delta = 1

# Gates run in this order before the metric. Cheapest and most structural first.
[[gates]]
name = "layers"
cmd = ["python", "-m", "pytest", "-q", "harness/plexus_loop/guards"]
timeout_s = 600

[[gates]]
name = "core"
cmd = ["python", "harness/plexus_loop/build_core.py"]
timeout_s = 1800

# Positive check (Nov 3, after the false keep d626436): the predicates the frozen tests register
# must compile once plexus/core/predicate.py exists, and the two bad ones must raise. Before S3
# lands it has nothing to check. The compile and raise checks are the frozen tests' own; the
# paths() check is the brief's Option A contract that S5's seed reads. -I keeps the harness
# directory from shadowing stdlib modules, as the gate's own test runs it.
[[gates]]
name = "predicate_smoke"
cmd = ["python", "-I", "harness/plexus_loop/predicate_smoke.py"]
timeout_s = 120

[[gates]]
name = "cargo"
cmd = ["cargo", "test", "--workspace", "--quiet"]
timeout_s = 1800

# Narrowed on Joe's word (Nov 1): the worker can only change plexus/, crates/ and the
# Cargo files, which only repo-scanning tests and the harness's own tests can notice.
# The full comfy-cozy suite (5,158 tests, 9 min 29 s) runs once at mission end.
[[gates]]
name = "unit"
cmd = ["python", "-m", "pytest", "-q", "-x", "-m", "not integration",
       "tests/harness_plexus_loop", "tests/test_portability_guards.py",
       "tests/test_workflow_patch_engine_live.py"]
timeout_s = 1800

[worker]
kind = "ollama"
model = "qwen3-coder:30b"
host = "http://127.0.0.1:11434"
# Nov 4, Joe's go: 4800. A cold S8 attempt at the worst rates on record comes to about 3,520 s, and a reviewer proposed 4800 earlier.
timeout_s = 4800
# Run 12 attempt 4's prompt at 100000 chars cut plexus/membrane/exchange.py and the schema
# files (checked against the rebuilt prompt). 120000 holds every run 12 prompt whole; at the
# measured ~3.7 chars per token that is ~32k tokens, and 49152 leaves room for a 6k-token reply.
# Nov 4: 135000. With the S4 block in the brief, 120000 cuts stagekit.py and exchange.py from S4's first
# prompt and neuron.py after a gate failure. Measured on the real build_prompt: the first prompt is
# 127,474 chars, 33,956 tokens; the worst of ten states leaves 6,646 tokens after a 6,500-token reply.
# Nov 4, with test_truth_on_disk.py and test_window_burst.py in context: 150000. At 145000 S8's prompt after a gate
# failure loses neuron.py; 145,962 is the smallest budget that keeps it (the harness's own build_prompt on f276b96).
context_chars = 150000
num_ctx = 49152

[router]
# Joe (Nov 3): Jev for routing. Steps name their prerequisites (`after`), so Jev only ever
# chooses among steps that are ready; with one ready step it is not called at all. Code now keeps
# unready steps out, so any pick is safe and a wrong one costs one attempt: the floor only sends a
# near coin flip to the earliest ready step. At 0.5 Jev lost its first real choice (S7 at 0.36, Nov 4;
# with two options 0.5 needs p >= 0.75).
kind = "jev"
model = "jev-latest"
min_confidence = 0.1

[[steps]]
id = "S1"
targets = ["tests/acceptance/phase1/test_t0_schema_gate.py"]
files = ["plexus/schema/__init__.py", "plexus/schema/plugInfo.json", "plexus/schema/generatedSchema.usda"]
text = "Schema plugin: plexus/schema/__init__.py with plugin_dir() returning the directory of that file, plus plexus/schema/plugInfo.json and plexus/schema/generatedSchema.usda defining the four codeless single-apply API schemas T0 lists (PlexusProjectAPI, PlexusAssetAPI, PlexusNeuronAPI, PlexusOrganAPI) with exactly the attributes, Sdf types and allowedTokens the test lists. Follow the file shape in the worker brief. No pxr import in plexus/schema."

[[steps]]
id = "S2"
after = ["S1"]
targets = ["tests/acceptance/phase1/test_t1_propagation.py"]
files = ["plexus/core/__init__.py", "plexus/membrane/__init__.py", "plexus/membrane/exchange.py", "plexus/core/stagekit.py", "plexus/core/axon.py"]
text = "Membrane, stagekit and axon in Python. Create plexus/core/__init__.py and plexus/membrane/__init__.py with a docstring only; never edit plexus/__init__.py; axon.py and stagekit.py never import each other. Files: plexus/membrane/exchange.py (create_exchange, register_participant, participants; registers the schema plugin in-process at import), plexus/core/stagekit.py (create_project: a root layer whose def /Exchange carries Sdf.Reference(<exchange.usda path>, '/Exchange') with an explicit prim path, because without one or a defaultPrim on exchange.usda B gets an unresolved-reference error and composes nothing; and whose /Project has PlexusProjectAPI with plexus:projectId; create_exchange and create_project use Sdf.Layer.FindOrOpen and call CreateNew only when the file is missing), and plexus/core/axon.py (StageEvent dataclass; PlexusAxon(stage, debounce_s=0.05) with subscribe, start, cool; a Tf.Notice callback that only copies paths and enqueues; one dispatcher thread that coalesces within the debounce window and calls subscribers outside the callback)."

[[steps]]
id = "S3"
after = ["S2"]
targets = ["tests/acceptance/phase1/test_t2_predicate_precision.py::test_bad_predicates_fail_at_registration"]
files = ["plexus/core/predicate.py", "plexus/core/neuron.py"]
text = "Rust grammar-v0 predicate, kept on row 62. If this step ever routes again, start from plexus/core/predicate.py and plexus/core/neuron.py under Files: predicate.py re-exports PredicateError and compile_predicate from plexus._core, and register() calls compile_predicate(predicate, scope) before anything else, so PredicateError propagates. No Rust change."

[[steps]]
id = "S4"
after = ["S3"]
targets = ["tests/acceptance/phase1/test_t5_gate.py::test_write_inside_allowlist_lands"]
files = ["plexus/core/neuron.py", "plexus/membrane/gate.py", "plexus/core/axon.py", "plexus/membrane/exchange.py", "plexus/core/stagekit.py"]
text = "Runtime dispatcher, kept in run 19. If this step ever routes again, start from plexus/core/neuron.py and plexus/membrane/gate.py under Files, and resend plexus/core/axon.py, plexus/membrane/exchange.py and plexus/core/stagekit.py whole. No Rust change."

[[steps]]
id = "S5"
after = ["S4"]
targets = ["tests/acceptance/phase1/test_t2_predicate_precision.py::test_delta_threshold_and_cache", "tests/acceptance/phase1/test_t4_provenance.py"]
files = ["plexus/core/neuron.py"]
text = "Delta wiring in plexus/core/neuron.py. Fill the two comments that name S5: register() calls record.compiled.seed(self._values(record)), and _on_event, under the lock, calls record.compiled.commit_wake(values) with the same values eval saw, so sub-threshold changes accumulate. S7's comment stays above that call."

[[steps]]
id = "S6"
after = ["S5"]
targets = ["tests/acceptance/phase1/test_t5_gate.py::test_write_outside_allowlist_is_dropped_and_flagged"]
files = ["plexus/core/neuron.py", "plexus/membrane/gate.py"]
text = "A write outside the allowlist is dropped (nothing lands in any exchange layer) and the neuron prim gets an attribute whose name starts with plexus:flag holding a non-empty value, saved in the edit layer."

[[steps]]
id = "S7"
after = ["S5"]
targets = ["tests/acceptance/phase1/test_t3_budget.py"]
files = ["plexus/core/neuron.py"]
text = "Rust Budget, kept on row 84. If this step ever routes again, start from plexus/core/neuron.py under Files, whole, and keep the budget check, the mute branch, the dispatcher and the S5 lines. No Rust change."

[[steps]]
id = "S7b"
after = ["S7"]
targets = ["tests/acceptance/phase1/test_budget_order.py"]
files = ["plexus/core/neuron.py"]
text = "Budget order, plexus/core/neuron.py only, no Rust change. Send the file whole, not as a diff: start from the copy under Files and change only what this step names. In _on_event the budget check sits in its own with self._lock block above the predicate, so changes the predicate rejects spend the budget. Move it: delete that whole block, its lock line included, and put the same lines where the comment naming S7 is, replacing that comment, after if not record.compiled.eval(changed, values): continue and before record.compiled.commit_wake(values), inside the lock that already holds values, with no second with self._lock. The lines themselves do not change: now = self._clock(), the peek, the admit, the mute branch with record.handle.state and both self._author_on_neuron calls, the continue, the global budget check, and the admit on both budgets. A change the predicate rejects then spends nothing. Then isolate each record: wrap the whole body of for record in list(self._neurons.values()) in try: ... except Exception: traceback.print_exc(), so one neuron's failure, such as a Save that raises on its mute, leaves the neurons registered after it running. The continue lines stay inside the try. Keep the S5 lines, the thread start and everything else as they are."

[[steps]]
id = "S7c"
after = ["S7b"]
targets = ["tests/acceptance/phase1/test_mute_isolation.py"]
files = ["plexus/core/neuron.py"]
text = "A mute that cannot be saved, plexus/core/neuron.py only, no Rust change. Send the file whole, not as a diff: start from the copy under Files and change only what this step names; every other line stays, _run_action above all. One test is left: test_a_mute_that_cannot_be_saved_is_still_flagged_on_the_stage, in frozen test_mute_isolation.py. It fails with 'the mute must be flagged even unsaved', because the file in Files writes plexus:state and plexus:flag:budget with two self._author_on_neuron calls, each with its own Save: the first Save raises on a read-only file, so the flag is never authored. The change is in the mute branch of _on_event, inside the try that is already there. Delete those two self._author_on_neuron calls and put this in their place: with Sdf.ChangeBlock(): then spec = self.edit_layer.GetPrimAtPath(record.handle.prim_path), then _set_attr(spec, 'plexus:state', 'muted', Sdf.ValueTypeNames.Token), then _set_attr(spec, 'plexus:flag:budget', 'budget trip or mute', Sdf.ValueTypeNames.String); and after that block, still inside the try, one self.edit_layer.Save(). The state and the flag then reach the stage together, and a Save that raises only loses the file write. Keep the try and its except as they are, record.handle.state = 'muted' above them, and the budget check below the predicate. The reply must differ from the file in Files in those lines."

[[steps]]
id = "S8"
after = ["S5", "S6", "S7c"]
targets = ["tests/acceptance/phase1/test_t6_truth.py", "tests/acceptance/phase1/test_truth_on_disk.py"]
files = ["plexus/core/neuron.py"]
text = """The truth on disk, plexus/core/neuron.py only, no Rust change. Send the file whole, not as a diff: start from the copy under Files and change only what this step names. Add from datetime import datetime. Saving: in _author_on_neuron wrap self.edit_layer.Save() in try: ... except Exception: traceback.print_exc(), so a refused Save leaves the opinion on the stage and costs no wake; frozen test_mute_isolation.py makes the file read-only while another neuron wakes, and an unguarded Save there leaves self._running up and the runtime never idle. State: plexus:state is a Token. In _on_event, right after record.handle.state = 'awake', call self._author_on_neuron(record, 'plexus:state', 'awake', Sdf.ValueTypeNames.Token). In _run_action, inside the existing if record.handle.state == 'awake': guard, right after record.handle.state = 'dormant', call self._author_on_neuron(record, 'plexus:state', 'dormant', Sdf.ValueTypeNames.Token) and self._author_on_neuron(record, 'plexus:lastWake', datetime.now().astimezone().isoformat(timespec='seconds'), Sdf.ValueTypeNames.String). Both stay inside that guard, so a mute outlives the action, and both come before self._running -= 1. Register: register() may find these specs already in the layer after a restart, and a bare Sdf.AttributeSpec raises on a name that exists, so every attr = Sdf.AttributeSpec(...) with its attr.default = ... line in register() becomes one _set_attr(neuron_prim, name, value, type_name) call. After them, still before self.edit_layer.Save(), add _set_attr(neuron_prim, 'plexus:state', 'dormant', Sdf.ValueTypeNames.Token), so a restart releases a mute. The flags: the deny flag's name becomes plexus:flag:publicationGate and its value becomes f"Write dropped at the membrane: {path} is outside {rt._participant_id}'s allowlist, so nothing landed. {rt._participant_id} writes only under {allowed}." with allowed = ', '.join(str(p) for p in rt._allowlist) on the line above. In the mute block the flag's name becomes plexus:flag:budgetGate and its value becomes f"Neuron muted: 3 wakes in a row refused (budget {record.budget_wakes} per {record.budget_window:g} s). Restart the neuron runtime to unmute it." Those two sentences go in exactly as written. Keep the budget check, the mute's one ChangeBlock and one Save, the try around them, the S5 lines and everything else as they are."""

[[steps]]
id = "S9"
after = ["S7c"]
targets = ["tests/acceptance/phase1/test_window_burst.py"]
files = ["plexus/core/axon.py"]
text = """The debounce window, plexus/core/axon.py only, no Rust change. Send the file whole, not as a diff: start from the copy under Files and change only what this step names. The dispatcher blocks on get(timeout=0.1), then drains with get(timeout=remaining) until debounce_s after that first event. It is debounce_s and never a literal 50 ms, because frozen test_window_burst.py passes its own debounce_s. Today the drain waits get(timeout=0.01) and its except breaks out at the first 10 ms of quiet, so the window closes early and a burst becomes several events. Replace the line while (time.perf_counter() - start_time) < self._debounce_s: with while (remaining := self._debounce_s - (time.perf_counter() - start_time)) > 0: and get(timeout=0.01) with get(timeout=remaining). Keep the except and its break, which now mean the window has run out. Keep the pending count, the window flag, the callback discipline and everything else as they are."""

# Night run (Joe, Nov 3, decision 2): sized from a 19:15 start to about 07:30. A running attempt is
# never cut, so hours = window - 1.1; attempts covers a GPU night at ~6 min each; the failure cap
# is high because no stop-on-repeat exists yet. Reset to 5 / 6 / 8 for a day run.
[budget]
attempts = 120
hours = 11
max_consecutive_failures = 30

[houdini]
cpu_threads = 8
cargo_jobs = 4

# The failure router (Joe, Nov 4, during run 19; wider, Nov 4). On every dropped attempt the gates or the metric
# ran on that printed something, ask TypeSafe's Jev which line of the brief fixes its failure, whether or not a
# known fix below matches, because a regex can fire on a symptom and name the wrong cause (rows 67 to 69). When
# Jev's confidence clears the floor, the next prompt quotes that line as a guess: on its own when no known fix
# matched, under the known fix as a second candidate when it is another line, and not at all when the known fix
# already quotes that line. It only shapes the prompt: gates and the metric still decide, so a wrong quote can
# cost an attempt each time its failure comes back, and can never make a keep.
# What leaves the machine: each call sends TypeSafe the failure output (the target failures and up to 4500
# characters of test or gate output), the step's id and text, and the brief's prose lines. Nothing else, and
# nothing when the attempt ran nothing or printed nothing. The floor was judged on jev-1.14.0, so
# the model is pinned: on run 19's brief, 32 of 39 replayed failures quoted, 30 right. The sample is small and
# in-sample, so every pick, confidence and model goes in the ledger as fix_route, and the pick in REVIEW.md.
# Lowering the floor has a known cost: at 0.6 an S2 failure (row 19) picks an S4 instruction, at 0.69. timeout_s
# is a deadline on the whole call; the slowest of 1,131 replayed calls took 1.32 s. Needs TYPESAFE_API_KEY, as
# [router] does; without it nothing is quoted and the run goes on.
[fix_router]
kind = "jev"
model = "jev-1.14.0"
brief = "harness/plexus_loop/missions/acceptance.worker.md"
min_confidence = 0.7
timeout_s = 10

# Recognised failures and the brief line that fixes each (harness quotes it under the
