# Retired Nov 4, on Joe's /dream apply: the known fixes for predicate.rs, py.rs and the rank rule, with the brief lines they quoted. S3 and S7 are kept and
# merged, and Rust is out of focus, so no attempt can reach these errors. Their last firing was row 58. git show ac84b88 has them, if a later mission writes Rust.

