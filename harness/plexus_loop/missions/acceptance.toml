anchor = "Never call `Usd.Prim.ApplyAPI`"

[[known_fixes]]
match = "module 'pxr.Usd' has no attribute 'Plug'"
file = "harness/plexus_loop/missions/acceptance.worker.md"
anchor = "`Usd.Plug` does not exist"

[[known_fixes]]
