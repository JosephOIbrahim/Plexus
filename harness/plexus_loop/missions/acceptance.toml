# First Plexus mission (Blueprint v5.3 §11 Phase 1, §12).
# It scores the frozen phase 1 acceptance tests (the schema gate and T1 to T6)
# and refuses to start until tests/acceptance/phase1 exists. T7 and T8 in
# phase2 are the next mission. Claude writes and revises mission files; the local
# worker only makes attempts inside one. Plan: missions/acceptance.plan.md.
# Joe's decisions (Nov 1): Option A, narrowed unit gate, this file and C1-C6 as written,
# no maturin in pyproject.toml, five Jev-routed attempts for the first run.

[mission]
name = "acceptance"
goal = "Make the frozen Plexus phase 1 acceptance tests in tests/acceptance/phase1 (the schema gate and T1 to T6, from PLEXUS_SPEC.md) pass, one honest step at a time. tests/acceptance/CONTRACT.md is the Python surface they call; harness/plexus_loop/missions/acceptance.worker.md says how the work is split and what the gates enforce."
requires = ["tests/acceptance/phase1", "PLEXUS_SPEC.md"]
focus = ["plexus/**", "crates/**", "Cargo.toml", "Cargo.lock"]
frozen = ["tests/acceptance/**", "harness/**", "docs/plexus/**", "PLEXUS_SPEC.md", ".github/**", "pyproject.toml"]
context = [
  "harness/plexus_loop/missions/acceptance.worker.md",
  "tests/acceptance/CONTRACT.md",
  "tests/acceptance/_support.py",
  "tests/acceptance/conftest.py",
  "tests/acceptance/phase1/test_t0_schema_gate.py",
  "tests/acceptance/phase1/test_t1_propagation.py",
  "tests/acceptance/phase1/test_t2_predicate_precision.py",
  "tests/acceptance/phase1/test_t3_budget.py",
  "tests/acceptance/phase1/test_t4_provenance.py",
  "tests/acceptance/phase1/test_t5_gate.py",
  "tests/acceptance/phase1/test_t6_truth.py",
  "PLEXUS_SPEC.md",
]

[metric]
kind = "pytest_failures"
target = "tests/acceptance/phase1"
direction = "lower"
min_delta = 1

# Gates run in this order before the metric. Cheapest and most structural first.
[[gates]]
name = "layers"
cmd = ["python", "-m", "pytest", "-q", "harness/plexus_loop/guards"]
timeout_s = 600

[[gates]]
name = "core"
cmd = ["python", "harness/plexus_loop/build_core.py"]
timeout_s = 1800

[[gates]]
name = "cargo"
cmd = ["cargo", "test", "--workspace", "--quiet"]
timeout_s = 1800

# Narrowed on Joe's word (Nov 1): the worker can only change plexus/, crates/ and the
# Cargo files, which only repo-scanning tests and the harness's own tests can notice.
# The full comfy-cozy suite (5,158 tests, 9 min 29 s) runs once at mission end.
[[gates]]
name = "unit"
cmd = ["python", "-m", "pytest", "-q", "-x", "-m", "not integration",
       "tests/harness_plexus_loop", "tests/test_portability_guards.py",
       "tests/test_workflow_patch_engine_live.py"]
timeout_s = 1800

[worker]
kind = "ollama"
model = "qwen3-coder:30b"
host = "http://127.0.0.1:11434"
timeout_s = 1800
context_chars = 100000
num_ctx = 40960

[router]
kind = "jev"
model = "jev-latest"
min_confidence = 0.3

[[steps]]
id = "S1"
targets = ["tests/acceptance/phase1/test_t0_schema_gate.py"]
files = ["plexus/schema/__init__.py", "plexus/schema/plugInfo.json", "plexus/schema/generatedSchema.usda"]
text = "Schema plugin: plexus/schema/__init__.py with plugin_dir() returning the directory of that file, plus plexus/schema/plugInfo.json and plexus/schema/generatedSchema.usda defining the four codeless single-apply API schemas T0 lists (PlexusProjectAPI, PlexusAssetAPI, PlexusNeuronAPI, PlexusOrganAPI) with exactly the attributes, Sdf types and allowedTokens the test lists. Follow the file shape in the worker brief. No pxr import in plexus/schema."

[[steps]]
id = "S2"
targets = ["tests/acceptance/phase1/test_t1_propagation.py"]
files = ["plexus/core/__init__.py", "plexus/membrane/__init__.py", "plexus/membrane/exchange.py", "plexus/core/stagekit.py", "plexus/core/axon.py"]
text = "Membrane, stagekit and axon in Python. Create plexus/core/__init__.py and plexus/membrane/__init__.py with a docstring only; never edit plexus/__init__.py; axon.py and stagekit.py never import each other. Files: plexus/membrane/exchange.py (create_exchange, register_participant, participants; registers the schema plugin in-process at import), plexus/core/stagekit.py (create_project: a root layer whose def /Exchange carries Sdf.Reference(<exchange.usda path>, '/Exchange') with an explicit prim path, because without one or a defaultPrim on exchange.usda B gets an unresolved-reference error and composes nothing; and whose /Project has PlexusProjectAPI with plexus:projectId; create_exchange and create_project use Sdf.Layer.FindOrOpen and call CreateNew only when the file is missing), and plexus/core/axon.py (StageEvent dataclass; PlexusAxon(stage, debounce_s=0.05) with subscribe, start, cool; a Tf.Notice callback that only copies paths and enqueues; one dispatcher thread that coalesces within the debounce window and calls subscribers outside the callback)."

[[steps]]
id = "S3"
targets = ["tests/acceptance/phase1/test_t2_predicate_precision.py::test_bad_predicates_fail_at_registration"]
files = ["crates/plexus-core/src/predicate.rs", "crates/plexus-core/src/lib.rs", "crates/plexus-core/src/py.rs", "plexus/core/predicate.py", "plexus/core/neuron.py"]
text = "Rust grammar-v0 predicate, all whole files. crates/plexus-core/src/predicate.rs in plain Rust with the Value enum, compile() and Predicate signatures the brief lists: clauses changed, delta, attr, exists joined by AND only; OR or any other text is an Err; every path is absolute and inside the scope, meaning the part before the first '.' equals the scope or starts with scope + '/' (a plain starts_with would accept /Exchange/LookStateX). paths() gives each path once, in order. eval handles all four clause kinds, with delta compared against a cache that only seed and commit_wake write. Add #[cfg(test)] unit tests for OR, out-of-scope, and two 0.15 steps that wake once. lib.rs adds mod predicate;. py.rs is the brief's skeleton without the Budget parts. plexus/core/predicate.py: from plexus._core import PredicateError, compile_predicate. plexus/core/neuron.py: NeuronRuntime.__init__ (register_participant first, then open the composed exchange as its stage, so the sublayer append never reaches its axon; edit_layer is Sdf.Layer.FindOrOpen of its own from_<id>.usda, the same object the stage composes) and register(), which calls compile_predicate(predicate, scope) before anything else, so PredicateError propagates."

[[steps]]
id = "S4"
targets = ["tests/acceptance/phase1/test_t5_gate.py::test_write_inside_allowlist_lands"]
files = ["plexus/core/neuron.py", "plexus/membrane/gate.py"]
text = "Runtime start/stop/wait_idle: on each coalesced StageEvent, filter by the neuron's scope, evaluate it with Predicate.eval(changed, values) from S3 (changed: list of str paths from the event; values: dict of the composed values of Predicate.paths(); no Rust change in this step), run the action on a worker thread with a ctx whose author() checks the path allowlist (plexus/membrane/gate.py: /Exchange/<participant>/** plus granted paths), defines missing ancestors as def, authors the value and plexus:sourceLayer into the edit layer, and saves the layer. Define /Plexus/Neurons/<name> with PlexusNeuronAPI in the edit layer at register()."

[[steps]]
id = "S5"
targets = ["tests/acceptance/phase1/test_t2_predicate_precision.py::test_delta_threshold_and_cache", "tests/acceptance/phase1/test_t4_provenance.py"]
files = ["plexus/core/neuron.py"]
text = "Delta wiring in plexus/core/neuron.py. predicate.rs already evaluates delta since S3: touch it only to fix a bug its own unit tests show, and add no .rs file. register() calls Predicate.seed with the composed values of Predicate.paths(); right before the action runs, call commit_wake with the same values eval saw, so sub-threshold changes accumulate; plexus:sourceLayer on the authored prim names the edit layer; the neuron returns to state dormant after each wake and wakes counts on the handle."

[[steps]]
id = "S6"
targets = ["tests/acceptance/phase1/test_t5_gate.py::test_write_outside_allowlist_is_dropped_and_flagged"]
files = ["plexus/core/neuron.py", "plexus/membrane/gate.py"]
text = "A write outside the allowlist is dropped (nothing lands in any exchange layer) and the neuron prim gets an attribute whose name starts with plexus:flag holding a non-empty value, saved in the edit layer."

[[steps]]
id = "S7"
targets = ["tests/acceptance/phase1/test_t3_budget.py"]
files = ["crates/plexus-core/src/budget.rs", "crates/plexus-core/src/lib.rs", "crates/plexus-core/src/py.rs", "plexus/core/neuron.py"]
text = "Rust Budget in crates/plexus-core/src/budget.rs, plain Rust: Budget::new(wakes: u32, window_s: f64), peek(&self, now: f64) -> &'static str (pure) and admit(&mut self, now: f64) -> &'static str, each wake, trip or mute. A wake at t counts while now < t + window_s; a wake resets the trip count; the third consecutive trip mutes; once muted, always mute. Add #[cfg(test)] tests where Budget::new(1, 10.0) admitted at t = 0, 2, 4, 6 gives wake, trip, trip, mute. lib.rs adds mod budget;. py.rs, whole file, gains the brief's PyBudget block and its add_class line. The runtime follows Budget order in the brief with the injected clock; on mute it writes plexus:state = muted plus a plexus:flag attribute on the neuron prim in the edit layer, saved."

[[steps]]
id = "S8"
targets = ["tests/acceptance/phase1/test_t6_truth.py"]
files = ["plexus/core/neuron.py"]
text = "Every opinion the runtime authors is saved as it lands, including plexus:state, plexus:lastWake and flags, so a runtime killed mid-session and reopened from disk reproduces all composed state."

[budget]
attempts = 5
hours = 6
max_consecutive_failures = 8

[houdini]
cpu_threads = 8
cargo_jobs = 4

# Recognised failures and the brief line that fixes each (harness quotes it under the
# target-test failure). Each anchor appears once in the brief; a test checks they resolve.
[[known_fixes]]
match = "null or expired layer"
file = "harness/plexus_loop/missions/acceptance.worker.md"
anchor = "`FindOrOpen` returns `None` for a missing file"

[[known_fixes]]
match = "has no attribute 'AddReference'"
file = "harness/plexus_loop/missions/acceptance.worker.md"
anchor = "`Usd.Prim` has no `AddReference`"

[[known_fixes]]
match = "Cannot find a valid schema for the provided schema identifier|has no attribute 'ApplyAPI'"
file = "harness/plexus_loop/missions/acceptance.worker.md"
anchor = "Never call `Usd.Prim.ApplyAPI`"

[[known_fixes]]
match = "module 'pxr.Usd' has no attribute 'Plug'"
file = "harness/plexus_loop/missions/acceptance.worker.md"
anchor = "`Usd.Plug` does not exist"

[[known_fixes]]
match = "type object 'Notice' has no attribute 'ObjectsChanged'"
file = "harness/plexus_loop/missions/acceptance.worker.md"
anchor = "`Tf.Notice.ObjectsChanged` does not exist"

[[known_fixes]]
match = "ListProxy_SdfSubLayerTypePolicy"
file = "harness/plexus_loop/missions/acceptance.worker.md"
anchor = "`layer.subLayerPaths` is a live list proxy"

[[known_fixes]]
match = "NameError: name '(Sdf|Tf|Usd|Plug|Vt|Gf)' is not defined"
file = "harness/plexus_loop/missions/acceptance.worker.md"
anchor = "Import every `pxr` module a file names"

[[known_fixes]]
match = '\((Windows|Posix)?Path[,)]'
file = "harness/plexus_loop/missions/acceptance.worker.md"
anchor = "take a `str`, never a `pathlib.Path`"

[[known_fixes]]
match = "module 'pxr.Tf' has no attribute '(Event|Token|Lock|RLock|Thread|Queue|Condition|Timer)'"
file = "harness/plexus_loop/missions/acceptance.worker.md"
anchor = "Threads, events, locks and queues come from Python's"
