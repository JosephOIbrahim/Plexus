           "tests/acceptance/phase2/test_t8_blindness.py",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_relative_output_dir_gives_an_absolute_path",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_dead_engine_is_an_organ_error",
           "tests/acceptance/phase2/test_organ_surface.py::test_seed_lands_in_the_seed_input_and_nowhere_else",
           "tests/acceptance/phase2/test_organ_surface.py::test_submit_leaves_the_jobs_own_graph_alone",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_seed_wired_from_a_link_survives",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_seed_that_never_reached_the_engine_is_not_recorded",
           "tests/acceptance/phase2/test_organ_surface.py::test_noise_seed_is_written",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_class_the_engine_lacks_stops_before_the_post",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_seed_past_int64_is_refused_before_the_post",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_colorspace_outside_the_schema_is_refused_before_the_post",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_second_job_under_one_id_never_takes_the_first_handle",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_refused_graph_carries_the_engines_words",
           "tests/acceptance/phase2/test_organ_surface.py::test_submit_returns_before_the_job_is_done",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_handle_carries_no_engine_id",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_engine_id_leaves_only_as_metadata",
           "tests/acceptance/phase2/test_organ_surface.py::test_no_error_core_sees_holds_the_engine_id",
           "tests/acceptance/phase2/test_organ_surface.py::test_result_stops_at_the_deadline",
           "tests/acceptance/phase2/test_organ_surface.py::test_one_refused_history_read_leaves_the_job_running",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_dead_engine_during_a_poll_waits_out_the_deadline_and_voids_the_job",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_wrong_history_route_fails_at_once",
           "tests/acceptance/phase2/test_organ_surface.py::test_an_unknown_handle_is_an_organ_error",
           "tests/acceptance/phase2/test_organ_surface.py::test_two_open_jobs_collect_out_of_order",
           "tests/acceptance/phase2/test_organ_surface.py::test_an_error_entry_raises",
           "tests/acceptance/phase2/test_organ_surface.py::test_an_entry_without_images_raises",
           "tests/acceptance/phase2/test_organ_surface.py::test_an_entry_with_only_a_preview_raises",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_first_output_image_is_found_past_a_node_without_images",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_saved_output_wins_over_a_preview",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_view_query_carries_subfolder_and_type",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_file_on_disk_holds_the_engines_bytes",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_file_lands_under_output_dir",
           "tests/acceptance/phase2/test_organ_surface.py::test_two_jobs_with_one_engine_filename_keep_two_files",
           "tests/acceptance/phase2/test_organ_surface.py::test_model_hashes_are_empty_and_engine_is_the_organ_id",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_record_holds_the_seed_the_colorspace_and_when",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_fingerprint_stands_still_when_only_free_memory_moves",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_fingerprint_moves_with_every_field_of_the_environment",
           "tests/acceptance/phase2/test_organ_surface.py::test_capabilities_name_the_engines_node_classes",
           "tests/acceptance/phase2/test_organ_surface.py::test_profile_holds_the_organ_api_fields",
           "tests/acceptance/phase2/test_organ_surface.py::test_stream_says_queued_then_done",
           "tests/acceptance/phase2/test_organ_surface.py::test_stream_stops_at_the_deadline",
           "tests/acceptance/phase2/test_organ_surface.py::test_stream_says_failed_on_an_error_entry",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_organ_imports_the_standard_library_and_the_contract_only"]
files = ["plexus/organs/protocol.py", "plexus/organs/cozy.py", "plexus/organs/__init__.py"]
text = """Your reply holds exactly three ```file blocks, in this order: plexus/organs/protocol.py, then plexus/organs/cozy.py, then plexus/organs/__init__.py. A reply with fewer is dropped unread: run 1 sent __init__.py alone seven times in eight attempts and every one was dropped. The organ, two new files and one already in the repo, no Rust change, no new Rust test and no test of your own. All of this step is required: the rule above about the smallest change means the smallest change that does all of this step. Before this step lands, all five T7 tests fail with No module named 'plexus.organs.cozy', and so does nearly every test of frozen test_organ_surface.py. If plexus/organs/cozy.py is already under Files, an attempt has kept: start from that copy and not the skeleton, send all three files again, and aim at this step's targets that the latest metric output lists as FAILED. Each test's name says the clause it reads, and a failure this step does not aim at belongs to a later step. Run 2 kept a cozy.py that passes all but two of this step's tests, so the kept copy under Files still needs these four changes, each one required, and nothing else in it changes. One, _history_entry: both raises in its except urllib.error.HTTPError branch, the 404 one and the one under else, become raise OrganError(f'/history: {e}'), with no prompt_id and no URL in them, because the id is the engine's and test_no_error_core_sees_holds_the_engine_id reads every error's text for it; the 500-or-above branch and the except (urllib.error.URLError, OSError): return None branch stay as they are. Two, stream, while _history_entry returns None: yield Progress(handle.correlation_id, 'queued'), then time.sleep(self._poll_s), on every such poll. Three, stream, once an entry is there: yield exactly one Progress, 'failed' when entry.get('status', {}).get('status_str') == 'error' and 'done' otherwise, then return; it never polls again on an entry, because a loop with no sleep sends hundreds of requests a second. Four, result: an entry whose status_str is 'error' raises OrganError('the engine failed this job'), never with the entry in the message, because a real entry holds the engine's id and the whole graph. plexus/organs/protocol.py is the brief's protocol block, copied exactly; frozen T8 reads that file line by line, so it must never name prompt_id, class_type, cfg or a node class, in code, comments or strings. plexus/organs/cozy.py starts from the brief's skeleton: every import, constant and signature stays as written, and each raise NotImplementedError becomes its body. These are the bodies. __init__ stores endpoint.rstrip('/') as self._endpoint, Path(output_dir).resolve() as self._output_dir with mkdir(parents=True, exist_ok=True), poll_s, deadline_s, self._jobs = {} and self._nodes = None. _get_json opens self._endpoint + route with urllib.request.urlopen and HTTP_TIMEOUT_S and returns json.loads of the body; urllib.error.URLError and OSError become OrganError with the route and the error's text. _history_entry does not go through _get_json: it opens self._endpoint + f'/history/{prompt_id}' the same way and returns .get(prompt_id) of the json.loads of the body, reading the variable prompt_id and not the quoted word. An urllib.error.HTTPError with code 500 or above, a URLError or an OSError returns None, which means not yet; any other HTTPError raises OrganError with '/history' and the error's text, never the id. Scored by test_link_arrays_survive_the_organ_byte_for_byte, submit does this: first it raises OrganError, before anything is sent, when self._jobs already holds job.correlation_id, when job.colorspace is not in COLORSPACES, or when job.seed is outside INT64_MIN to INT64_MAX, the range of plexus:seed. Then graph = copy.deepcopy(job.graph); for each node in graph.values(), for each name in SEED_INPUTS, if isinstance(node['inputs'].get(name), int), node['inputs'][name] = job.seed, and remember that a seed was written. Nothing else in the graph changes, because the test compares every link and every class_type with the graph it gave you. Then it checks every node['class_type'] against self.capabilities() and raises OrganError naming any that is missing, then POSTs json.dumps({'prompt': graph}).encode('utf-8') to self._endpoint + '/prompt' exactly once with Content-Type application/json; urllib.error.HTTPError becomes OrganError holding the reply's body text, because a real engine explains a refused graph there, and URLError and OSError become OrganError as in _get_json. It reads prompt_id from the reply, sets self._jobs[job.correlation_id] = _Submitted(prompt_id, job.seed if a seed was written else None, job.colorspace), and returns JobHandle(job.correlation_id), which carries the correlation id and nothing else. Scored by test_result_waits_for_history_and_a_real_file, result does this: look up self._jobs[handle.correlation_id], raising OrganError when it is missing; call self._history_entry every poll_s until it is not None, and raise OrganError past deadline_s, so a timeout voids the job instead of hanging it; the first reads come back empty and the test counts them, so nothing but that entry ever means done. An entry whose entry.get('status', {}).get('status_str') == 'error' raises OrganError. Take the first image whose type is 'output' across the images lists in entry['outputs'].values(), and raise OrganError when there is none, because a preview node's image has type 'temp' and is not the asset. _fetch_file reads /view with urllib.parse.urlencode of that item's filename, subfolder and type, with URLError and OSError becoming OrganError as in _get_json, and writes the bytes to self._output_dir / f"{uuid.uuid4().hex}_{Path(filename).name}", so a later job with the same engine filename never overwrites this file and the engine's id stays off the path. sha256 is hashlib.sha256(path.read_bytes()).hexdigest(), read back from the file. Return AssetRecord(path, sha256, metadata) with metadata holding engine = ORGAN_ID, engineJobId = prompt_id, envFingerprint = self._env_fingerprint(), organVersion = ORGAN_VERSION, modelHashes = [], colorspace and createdAt = datetime.now(timezone.utc).isoformat(timespec='seconds'), and seed only when a seed was written. Scored by test_env_fingerprint_tracks_the_engine_environment, _env_fingerprint reads /system_stats and /object_info through _get_json at that moment and hashes only what the brief lists. capabilities returns sorted(self._nodes), reading /object_info into self._nodes the first time. profile returns OrganProfile(ORGAN_ID, 'comfyui', self._endpoint, self.capabilities(), 'free'). stream yields Progress(handle.correlation_id, 'queued') on each poll while _history_entry is None, then one Progress with 'done' or 'failed', then stops, with the same lookup, poll_s and deadline_s as result and OrganError past the deadline. Frozen test_organ_surface.py reads nearly every clause T7 and T8 do not, and the few it leaves unread are required all the same. job.inputs is not used in this mission. Last, plexus/organs/__init__.py: it is already in the repo as one docstring line, and your reply sends it unchanged, that one line and nothing else, never a __doc__ = line, because the layers gate drops any code after the docstring."""

[[steps]]
id = "O2"
after = ["O1"]
targets = ["tests/acceptance/phase2/test_t7_round_trip.py::test_neuron_round_trip_composes_into_both_projects",
           "tests/acceptance/phase2/test_t8_blindness.py",
           "tests/acceptance/phase2/test_organ_surface.py::test_neuron_imports_nothing_from_organs",
           "tests/acceptance/phase2/test_organ_surface.py::test_every_asset_attribute_lands_with_the_schemas_type_and_on_disk",
           "tests/acceptance/phase2/test_organ_surface.py::test_each_asset_attribute_holds_the_records_value",
           "tests/acceptance/phase2/test_organ_surface.py::test_an_asset_outside_the_allowlist_is_dropped_and_flagged",
           "tests/acceptance/phase2/test_organ_surface.py::test_the_deny_flag_says_what_ctx_author_says",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_record_with_only_the_contracts_five_keys_still_lands",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_value_that_cannot_land_leaves_nothing_in_the_file",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_second_asset_on_one_prim_does_not_raise",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_changed_predicate_does_not_rewake_on_its_own_asset",
           "tests/acceptance/phase2/test_organ_surface.py::test_two_neurons_on_one_write_both_publish",
           "tests/acceptance/phase2/test_organ_surface.py::test_a_second_process_reads_the_asset_from_the_file"]
files = ["plexus/core/neuron.py"]
text = """ctx.author_asset, plexus/core/neuron.py only, no Rust change, no new Rust test and no test of your own. Send the file whole, not as a diff: start from the one copy of neuron.py in this prompt, under Files or under Your last attempt's files, and change only what this step names; every other line stays, _on_event, _run_action, register, _author_on_neuron, _save_refused and _Ctx.author above all, because the neuron_unchanged gate compares your file's code with the last kept commit and drops any other change, a new import or a new helper included. neuron.py must never name prompt_id, class_type, cfg or a node class, because frozen T8 reads it line by line, and it never imports plexus.organs, even for a type hint. One T7 test is left, test_neuron_round_trip_composes_into_both_projects, and so are the author_asset tests of frozen test_organ_surface.py. T7's fails with AssertionError: projectA.usda, because _Ctx has no author_asset: the action raises AttributeError on its own thread, _run_action prints it, and the asset prim never lands. The others name that AttributeError. The change: add one method to class _Ctx, right after author and at the same indent, def author_asset(self, prim_path, record). It opens with the same lines author opens with: rt = self._runtime, path = Sdf.Path(prim_path), and the same if not check_allowlist(path, rt._allowlist): branch, every line of it, with its rt._author_on_neuron call with name plexus:flag:publicationGate and the same two-sentence value, and its return, because CONTRACT.md says the same gate covers both and test_the_deny_flag_says_what_ctx_author_says compares the two flags. Then layer = rt.edit_layer and meta = record.metadata. Then, before any lock, build one list named values of (name, value, type_name) triples, every type a member of Sdf.ValueTypeNames, so a key that is missing or a value that cannot land raises with nothing authored. Spec section 3 lists all thirteen: plexus:assetPath with Sdf.AssetPath(str(record.path)) as Asset; plexus:sha256 with record.sha256 as String; plexus:envFingerprint with meta['envFingerprint'] as String; plexus:sourceLayer with layer.identifier as String; plexus:engine with meta['engine'] as String; plexus:engineJobId with meta['engineJobId'] as String; plexus:organVersion with meta['organVersion'] as String; plexus:modelHashes with list(meta['modelHashes']) as StringArray; plexus:retryOf with '' as String; plexus:retryReason with 'none' as Token; and, each only when its key is in meta, because CONTRACT.md promises only the five keys above, plexus:seed with meta['seed'] as Int64, raising ValueError first when it does not fit 64 bits, plexus:colorspace with meta['colorspace'] as Token and plexus:createdAt with meta['createdAt'] as String. Then with rt._lock: then with Sdf.ChangeBlock(): then spec = Sdf.CreatePrimInLayer(layer, path), the same for prefix in path.GetPrefixes() loop that author has, setting each specifier to Sdf.SpecifierDef, which CONTRACT.md requires, then spec.SetInfo('apiSchemas', Sdf.TokenListOp.Create(prependedItems=['PlexusAssetAPI'])), then one _set_attr(spec, name, value, type_name) call for each item of values, never a bare Sdf.AttributeSpec, because a second wake would raise. After the ChangeBlock, still inside with rt._lock, call layer.Save(), because CONTRACT.md says saved as it lands and a frozen test reads the file before the quiesce's own Save can flush it. Two neurons woken by one project write kill the interpreter without the lock, and a frozen test runs that in a child process. The reply must differ from that copy of neuron.py in those lines and in no others."""

# A day run. At 30 to 40 minutes an attempt, 8 attempts take at most about 5.3 hours, and the run stops as soon as every target test passes. Decision 6 has the odds behind 8 against the 5 mission acceptance names.
[budget]
attempts = 8
hours = 6
max_consecutive_failures = 8

[houdini]
cpu_threads = 8
cargo_jobs = 4

# The failure router is off for this mission, so nothing leaves the machine. Its floor was judged on run 19's brief and
# jev-1.14.0, and this brief is new. Known fixes below still quote lines from the local brief. Turning it on sends TypeSafe
# the failure output, the step's id and text, and the brief's prose lines on every full drop; that is Joe's call.
[fix_router]
kind = "none"

