# Second Plexus mission: Blueprint v5.3 section 11 Phase 2, Spec v2.1 section 10. It scores the frozen phase 2
# acceptance tests, T7, T8 and test_organ_surface.py, and refuses to start until Joe has placed that last file. Claude writes and revises
# mission files; the local worker only makes attempts inside one. Plan: missions/organ.plan.md.
# DRAFT, nothing below has run on the real repo. Joe's answers of Nov 5 are in, and organ.plan.md section 8 marks each with his words.

[mission]
name = "organ"
goal = "Make the frozen Plexus phase 2 acceptance tests in tests/acceptance/phase2, T7 and T8 from PLEXUS_SPEC.md and test_organ_surface.py, pass, one honest step at a time, without breaking phase 1. tests/acceptance/CONTRACT.md is the Python surface they call; harness/plexus_loop/missions/organ.worker.md says how the work is split and what the gates enforce."
requires = ["tests/acceptance/phase2/test_t7_round_trip.py", "tests/acceptance/phase2/test_organ_surface.py", "tests/acceptance/phase1", "PLEXUS_SPEC.md"]
# Only what the organ needs: its own package, and the one file that gains ctx.author_asset. crates/**, Cargo.toml and
# the rest of plexus/ are out, so a Rust reply or an edit to the axon drops before anything runs. T8's scan of plexus/
# and crates/ still covers all of it.
focus = ["plexus/organs/**", "plexus/core/neuron.py"]
frozen = ["tests/acceptance/**", "harness/**", "docs/plexus/**", "PLEXUS_SPEC.md", ".github/**", "pyproject.toml"]
# PLEXUS_SPEC.md is out of context on purpose: the brief carries the rows of sections 3 and 8 that this mission
# reads, and the worker's reading time is its largest cost after writing. Phase 1's tests are out too, and a read of the
# whole phase by hand on each keep speaks for them. test_organ_surface.py is out too: the step texts spell out every body,
# and a failure's own text reaches the next prompt. The plan's section 10 logs that choice with both measures.
context = [
  "harness/plexus_loop/missions/organ.worker.md",
  "tests/acceptance/CONTRACT.md",
  "tests/acceptance/_support.py",
  "tests/acceptance/conftest.py",
  "tests/acceptance/phase2/test_t7_round_trip.py",
  "tests/acceptance/phase2/test_t8_blindness.py",
]

[metric]
kind = "pytest_failures"
target = "tests/acceptance/phase2"
direction = "lower"
min_delta = 1
# The default of 1800 lets one quoted word in the history read hang a whole attempt for 30 minutes more, because T7 builds the organ with its 3600 s deadline. A timed-out metric leaves an empty tail and no known fix can
# fire on it, so the brief carries the line that explains it. The plan's section 5 has the phase's time on a right reply and on its worst wrong replies on a busy machine, against this limit.
timeout_s = 300

# Gates run in this order before the metric. Cheapest and most structural first.
[[gates]]
name = "layers"
cmd = ["python", "-m", "pytest", "-q", "harness/plexus_loop/guards"]
timeout_s = 600

# Why this gate: step O2 sends plexus/core/neuron.py whole, and many of its lines are read by no frozen test: ctx.author's lock, the global budget's check, the scope filter, plexus:tools, an action's printed
# error. A reply that loses one could still keep. This reads the parsed code against the last kept commit: every statement stands, and the file gains _Ctx.author_asset alone. It takes under a second.
# It is scaffolding, so the file lands in Claude's own commit on Joe's word before the first run.
[[gates]]
name = "neuron_unchanged"
cmd = ["python", "-I", "harness/plexus_loop/neuron_unchanged.py"]
timeout_s = 120

[[gates]]
name = "core"
cmd = ["python", "harness/plexus_loop/build_core.py"]
timeout_s = 1800

[[gates]]
name = "predicate_smoke"
cmd = ["python", "-I", "harness/plexus_loop/predicate_smoke.py"]
timeout_s = 120

[[gates]]
name = "cargo"
cmd = ["cargo", "test", "--workspace", "--quiet"]
timeout_s = 1800

# The same narrowed set as mission acceptance, Joe's word of Nov 1. None of it can see plexus/organs or neuron.py: only the
# harness's own tests and two repo scans of agent/ and cognitive/. Kept so the gates match; dropping it is Joe's call.
[[gates]]
name = "unit"
cmd = ["python", "-m", "pytest", "-q", "-x", "-m", "not integration",
       "tests/harness_plexus_loop", "tests/test_portability_guards.py",
       "tests/test_workflow_patch_engine_live.py"]
timeout_s = 1800

[worker]
kind = "ollama"
model = "qwen3-coder:30b"
host = "http://127.0.0.1:11434"
# The value mission acceptance runs with since Joe's go of Nov 4. Worst case for this mission, at the worst rates on record, 23.2 tokens a second reading on row 85 and 1.54 writing on row 82,
# and with the worst prompt below: O1 after a full drop reads 24,384 tokens in 1,051 s and writes neuron.py whole, about 3,634 tokens, in 2,360 s, so 3,411 s. 3600 would hold too; 4800 costs nothing unless the model hangs.
timeout_s = 4800
# Measured with the harness's own build_prompt on the top rung of the scratch ladder, worst case of every state: the largest floor with nothing left out is 91,354 characters, O1 after a full drop.
# 95000 leaves about 3,646 characters of room, measured on S8 and S8b's neuron.py at 3414e36. The budget caps the files only, so the real prompt stays at its own size: at most 24,384 tokens,
# which leaves 24,768 of num_ctx for the reply against the 3,634 tokens neuron.py needs.  (Remeasured Nov 8 on 3414e36.)
context_chars = 95000
num_ctx = 49152

# The steps form a chain, so one step is ready at a time and no router call ever happens. "first" says that plainly, and
# no key is needed.
[router]
kind = "first"

[[steps]]
id = "O1"
targets = ["tests/acceptance/phase2/test_t7_round_trip.py::test_link_arrays_survive_the_organ_byte_for_byte",
           "tests/acceptance/phase2/test_t7_round_trip.py::test_result_waits_for_history_and_a_real_file",
