    def publish_organ_state(self, organ_id: str, state: str) -> Sdf.Path:
        """Author an organ's lifecycle as plexus:lifecycle on its prim in this participant's edit layer and return the prim's path.

        The host calls it with each state its engine's lifecycle reports, for an organ this runtime published. It authors nothing else
        on the prim, so it and publish_organ never undo each other. Every value is checked first, so a state that cannot land raises
        with nothing authored.
        """
        states = ("stopped", "starting", "ready", "unavailable")
        for field, value in (("organ_id", organ_id), ("state", state)):
            if not isinstance(value, str):
                raise TypeError(f"{field} must be a str, got {type(value).__name__}: {value!r}")
        if state not in states:
            raise ValueError(f"state {state!r} is not one of {', '.join(states)}")
        if not Sdf.Path.IsValidIdentifier(organ_id):
            raise ValueError(f"organ_id {organ_id!r} is not a valid prim name: it must be a USD identifier, a letter or underscore followed by letters, digits or underscores.")
        path = Sdf.Path("/Plexus/Organs").AppendChild(organ_id)
        layer = self.edit_layer
        with self._lock:
            spec = layer.GetPrimAtPath(path)
            if not spec or "PlexusOrganAPI" not in spec.GetInfo("apiSchemas").prependedItems:
                raise ValueError(f"{path} is not published in {self._participant_id}'s edit layer, so its state cannot land here. "
                                 f"Call publish_organ first: a runtime writes the state only of an organ it published.")
            with Sdf.ChangeBlock():
                _set_attr(spec, "plexus:lifecycle", state, Sdf.ValueTypeNames.Token)
            layer.Save()
        return path

Why each part is there, so none is dropped: organ_id and state are checked with isinstance and never coerced, so a value that is not a str raises TypeError; the four states are a tuple inside the method, never a module-level constant, and a state outside them, "failed" and "Ready" included, raises ValueError; the organ id is checked with Sdf.Path.IsValidIdentifier, as publish_organ checks it, and raises ValueError; every check runs before anything is authored, so a value that cannot land raises with nothing authored. Under self._lock the method reads the organ's prim spec in this runtime's own edit layer with layer.GetPrimAtPath and raises ValueError unless that spec prepends PlexusOrganAPI, so a runtime writes the state only of an organ it published itself; it never creates the prim and never calls Sdf.CreatePrimInLayer. It authors one attribute, plexus:lifecycle, as a token, through _set_attr inside an Sdf.ChangeBlock, so a second state replaces the first; it sets no apiSchemas, none of publish_organ's five attributes and no plexus:sourceLayer, so publish_organ and it never undo each other. layer.Save() runs inside with self._lock, after the ChangeBlock, so the state is in the file as it lands and a neuron in this process wakes on it. The prim's Sdf.Path is returned. neuron.py still never imports plexus.organs, even for a type hint, and never names an organ kind, in code, comments or strings. The reply must differ from that copy of neuron.py in those lines and in no others.'''

