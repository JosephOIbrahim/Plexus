Three: after the file's last line, return hashlib.sha256(fingerprint_json.encode()).hexdigest(), which ends CozyOrgan._env_fingerprint, come two blank lines and then this block, at module level, exactly as written here: the six constants, def _port_open and class CozyLifecycle at column zero, the methods at four spaces and their bodies at eight. It is the last thing in the file:

LISTEN = '127.0.0.1'
PORT_S = 1.0
STATS_S = 5.0
CHILD_ENV_DROP = ('COMFY_CLI_BACKGROUND', 'COMFY_OUTPUT', 'VIRTUAL_ENV', 'CONDA_PREFIX', 'PYTHONPATH', 'PYTHONHOME', 'PXR_PLUGINPATH_NAME')
CHILD_ENV_SET = {'COMFY_NO_TELEMETRY': '1', 'DO_NOT_TRACK': '1', 'PYTHONUNBUFFERED': '1', 'PYTHONIOENCODING': 'utf-8'}
_DIRECT = urllib.request.build_opener(urllib.request.ProxyHandler({}))


def _port_open(port: int) -> bool:
    """True when something accepts a TCP connection on LISTEN:port within PORT_S."""
    try:
        with socket.create_connection((LISTEN, port), timeout=PORT_S):
            return True
    except OSError:
        return False


class CozyLifecycle:
    """Starts, stops and measures one ComfyUI on 127.0.0.1:<port> through comfy-cli in the foreground, beside the organ contract.

    It owns only the process tree its own start() spawned, and never uses comfy-cli's background slot or its stop command, which
    are user-wide. Each measurement goes to report(state); the host points report at NeuronRuntime.publish_organ_state.
    """

    def __init__(self, workspace: Path, port: int, *, command: Sequence[str], report: Callable[[str], object],
                 extra: Sequence[str] = (), log: Path | None = None, ready_s: float = 300.0, stop_s: float = 30.0,
                 poll_s: float = 0.5):
        self._workspace = Path(workspace)
        self._port = port
        self._command = list(command)
        self._report = report
        self._extra = list(extra)
        self._log = log
        self._ready_s = ready_s
        self._stop_s = stop_s
        self._poll_s = poll_s
        self._proc = None
        self.endpoint = f'http://{LISTEN}:{port}'
        self.probe()  # a state an earlier process left on the stage is replaced before the constructor returns

    def probe(self) -> str:
        """Measure now, report it, return it."""
        return self._tell(self._measure())

    def start(self) -> str:
        state = self._measure()
        if state == 'ready':
            return self._tell('ready')
        if state == 'unavailable':
            self._tell('unavailable')
            raise OrganError(f"port {self._port} answers, but not as ComfyUI, so nothing was started there")
        if state == 'stopped':
            self._spawn()
        deadline = time.monotonic() + self._ready_s
        while True:
            if self._measure() == 'ready':
                return self._tell('ready')
            code = self._proc.poll()
            if code is not None:
                self._proc = None
                self._tell('unavailable')
                where = f"its output is in {self._log}" if self._log is not None else "its output was discarded"
                raise OrganError(f"comfy-cli exited with code {code} before ComfyUI answered on port {self._port}; {where}")
            if time.monotonic() > deadline:
                try:
                    self._kill()
                finally:
                    self._tell('unavailable')
                raise OrganError(f"ComfyUI did not answer on port {self._port} within {self._ready_s:g} s, so its process tree was killed")
            time.sleep(self._poll_s)

    def stop(self) -> str:
        if self._proc is None:
            raise OrganError(f"this lifecycle holds no process it started on port {self._port}, so it stops nothing")
        try:
            self._kill()
        finally:
            state = self._tell(self._measure())
        return state

    def _spawn(self) -> None:
        main = self._workspace / 'main.py'
        if not main.is_file():
            self._tell('unavailable')
            raise OrganError(f"Unavailable: {main} is not a file, so {self._workspace} is not a ComfyUI workspace and nothing was started")
        argv = [*self._command, '--skip-prompt', f'--workspace={self._workspace}', 'launch', '--',
                '--listen', LISTEN, '--port', str(self._port), *self._extra]
        env = {k: v for k, v in os.environ.items() if k.upper() not in CHILD_ENV_DROP}
        env.update(CHILD_ENV_SET)
        if os.name == 'nt':
            group = {'creationflags': subprocess.CREATE_NEW_PROCESS_GROUP | subprocess.CREATE_NO_WINDOW}
        else:
            group = {'start_new_session': True}
        self._tell('starting')
        out = open(self._log, 'ab') if self._log is not None else subprocess.DEVNULL
        try:
            self._proc = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=out, stderr=subprocess.STDOUT,
                                          cwd=str(self._workspace), env=env, **group)
        except OSError as e:
            self._tell('unavailable')
            raise OrganError(f"Unavailable: could not run {argv[0]}: {e}") from e
        finally:
            if self._log is not None:
                out.close()

    def _kill(self) -> None:
        """Kill the tree this lifecycle started, root and descendants together, then wait until the port no longer answers.

        The handle is dropped only once the root has ended, so a kill that cannot end it leaves the tree this lifecycle's to stop again.
        """
        proc = self._proc
        if proc.poll() is None:
            if os.name == 'nt':
                subprocess.run(['taskkill', '/T', '/F', '/PID', str(proc.pid)], stdin=subprocess.DEVNULL,
                               stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                               creationflags=subprocess.CREATE_NO_WINDOW, timeout=self._stop_s)
            else:
                try:
                    os.killpg(proc.pid, signal.SIGKILL)
                except ProcessLookupError:
                    pass
            try:
                proc.wait(timeout=self._stop_s)
            except subprocess.TimeoutExpired:
                raise OrganError(f"the process comfy-cli runs in on port {self._port} did not end within {self._stop_s:g} s of the kill; "
                                 f"it is still this lifecycle's, so stop() can try again") from None
        self._proc = None
        deadline = time.monotonic() + self._stop_s
        while _port_open(self._port):
            if time.monotonic() > deadline:
                raise OrganError(f"port {self._port} still answers {self._stop_s:g} s after the tree comfy-cli started was killed")
            time.sleep(self._poll_s)

    def _measure(self) -> str:
        if not _port_open(self._port):
            alive = self._proc is not None and self._proc.poll() is None
            return 'starting' if alive else 'stopped'
        try:
            with _DIRECT.open(self.endpoint + '/system_stats', timeout=STATS_S) as response:
                body = json.loads(response.read().decode('utf-8'))
        except (OSError, ValueError, http.client.HTTPException):
            return 'unavailable'
        return 'ready' if isinstance(body, dict) and isinstance(body.get('system'), dict) else 'unavailable'

    def _tell(self, state: str) -> str:
        self._report(state)
        return state

Why each part is there, so none is dropped. LISTEN is the loopback address the engine listens on and the endpoint names, so nothing off this machine reaches it. PORT_S caps the TCP connect at 1 s and STATS_S caps the GET at 5 s, so one measurement costs at most 6 s. CHILD_ENV_DROP lists the seven variables the child must not inherit: COMFY_CLI_BACKGROUND switches even a foreground launch into comfy-cli's background path, COMFY_OUTPUT, VIRTUAL_ENV and CONDA_PREFIX override the workspace's own python, and PYTHONPATH, PYTHONHOME and PXR_PLUGINPATH_NAME belong to this host; the names are compared with k.upper() because Windows environment names ignore case. CHILD_ENV_SET turns telemetry off with no consent prompt and keeps the child's output unbuffered UTF-8 in the log. _DIRECT is an opener with no proxy, so a system proxy never sees a loopback read. _port_open only connects and sends nothing. The constructor stores its arguments, holds no process (self._proc = None), sets endpoint, and probes once, so a state an earlier process left in the saved edit layer is replaced by a measurement before it returns. probe() measures, reports and returns. start() measures first: ready reports ready and spawns nothing; unavailable reports it and raises OrganError naming the port, spawning nothing; stopped spawns; starting means its own process is alive, so it spawns nothing more and waits. The loop returns ready once a measurement reads it; a measurement that reads unavailable during a start is not yet; when its own process has exited it drops the handle, reports unavailable and raises naming the exit code and the log's path, or saying its output was discarded when log is None, so the text never reads in None; when ready_s passes it kills the tree in a try and reports unavailable in the finally, so a kill that raises still leaves a measured token, never a stale starting; it sleeps poll_s between measurements. stop() raises OrganError, touching nothing and reporting nothing, when this lifecycle holds no process it started; otherwise it kills in a try and measures and reports in the finally. _spawn checks <workspace>/main.py first and raises an OrganError naming the path, with Unavailable in its text, when it is not a file. The argv is exact: --skip-prompt before the subcommand, --workspace always, because without it comfy-cli falls back to the cwd and then its own default workspace, launch, then --, then --listen and --port as two tokens each, never --port=N, then extra, which comfy-cli hands to main.py as it is. The child gets the filtered environment, a new process group on Windows or a new session on POSIX, stdin at end of file (DEVNULL), stdout and stderr appended to log or discarded, never an unread PIPE, which fills and blocks the engine, and cwd at the workspace. starting is reported first, before the log is opened and before Popen, so a report that raises leaves no file open; a Popen OSError reports unavailable and raises naming the program; the finally closes the parent's copy of the log. _kill ends the root and its descendants together, main.py included, so comfy-cli's reboot loop cannot start main.py again: taskkill /T /F /PID on Windows, os.killpg with SIGKILL on POSIX. It drops self._proc only after the root has ended; when the root does not end within stop_s it raises and keeps the handle, so stop() can try again. Then it waits up to stop_s for the port to refuse connections, because a read right after taskkill can still find it open. It never kills by a pid read from a file, the stage, comfy-cli's config or the TCP table. _measure reads starting when nothing accepts a connection and its own process is alive, stopped when nothing accepts and it has none, ready when GET /system_stats answers a JSON object whose system is an object, and unavailable when anything else answers; it catches OSError, which covers URLError, HTTPError and timeouts, ValueError, which covers bad JSON and bad UTF-8, and http.client.HTTPException, which is not an OSError. _tell calls report on the caller's thread, so an exception from report reaches the caller of the constructor, probe(), start() or stop(), and the tree already spawned stays in self._proc for stop(); the lifecycle starts no thread of its own. It runs command once per start and never comfy-cli's --background launch or comfy stop, which act on whatever process comfy-cli's user-wide config names. Nothing else in the file changes: no line of CozyOrgan, no other constant or helper, and the block is not split or reordered. That holds for CozyOrgan's history read too: its line except (urllib.error.URLError, OSError) as e: binds an e it never uses, and it stays exactly as it is, because fixing it changes a line this step does not name.'''

