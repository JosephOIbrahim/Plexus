[project]
name = "plexus"
version = "0.1.0a13"
description = "Plexus: a living network where projects compose into each other while running, agents wake only when needed, and execution engines are interchangeable organs. OpenUSD composition is the runtime."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Joseph Ibrahim"}]
requires-python = ">=3.11"
keywords = ["openusd", "usd-composition", "agent-runtime", "comfyui", "vfx"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
dependencies = [
    # Composer of record (Blueprint v5.4, §13.4), pinned to USD 0.26.5, the version Houdini 22 bundles.
    "usd-core==26.5",
]

[project.optional-dependencies]
dev = [
    # The versions Plexus CI and the release checklist run.
    "pytest==8.4.2",
    "pytest-asyncio==0.26.0",
    "ruff==0.15.10",
]

[project.urls]
Homepage = "https://github.com/JosephOIbrahim/Plexus"
Repository = "https://github.com/JosephOIbrahim/Plexus"

# plexus._core is built by harness/plexus_loop/build_core.py with cargo and copied into plexus/; there is no maturin step.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plexus"]

[tool.hatch.build.targets.sdist]
only-include = ["plexus", "crates", "Cargo.toml", "Cargo.lock"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring a real ComfyUI server, real API keys, or real filesystem (not mocked). Exclude in CI with -m 'not integration'.",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
ignore = ["E402"]  # Module-level imports after logging setup (intentional pattern)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]  # Unused variables in tests (side-effect assertions)
